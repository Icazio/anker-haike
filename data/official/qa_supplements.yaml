  - id: supp-bp-s1-pro-green-light
    title: What does the green indicator light on the S1 Pro (T8D04) pump hub mean?
    pn: [T8D04]
    category: breast_pump
    scope_note: T8D04 pump hub battery/charging indicator only; not the charging case or other models.
    content: |-
      A flashing green light means charging is in progress.
      A steady (solid) green light means charging is complete.
