# 对官方 Q&A 段落的人工审核结果（2026-10-09 第二批）。只改执行方式，原文不动；原文在 qa.yaml 里按生成文件约定不手改。
# 每条按 qa_id 与段落位置 pos（从 1 起，按原文出现顺序；原文编号会重复，如 bp-0123 的「Step 1:」与「1.」都是 1）定位。
# 可写：kind（question / action / statement / material_request / handoff）、options（question 的选项原文）、
# title（卡片标题；原文段落不是问句而改成 question 时必须给，question 卡只显示标题与选项）、
# branches（选项 → 目标：数字是段落位置，字符串是本条的 step_id 或 EXHAUSTED）、default（回答不在选项里时的目标）、
# retry_options（表示「还没做 / 不知道」的选项：选它或答非所问的短答时卡片不算答完，带提示重发一次）、
# caution（注意事项，与条目 Tips 一起显示；原文这一段没写、同型号另一条写了的后果）、
# disabled + reason（已核实不适用的段落，不生成步骤但保留原文）、
# parts（一段拆成多步：段内夹问句、段内诊断树。每部分可写上面的字段；第一部分从段首开始，之后每部分写 at = 段内唯一的
# 原文锚点，从锚点处切开，依次生成 s{pos}、s{pos}b、s{pos}c…；切出的文字拼起来就是原段落；media: true 指定由哪一部分挂原段图示 / 链接，
# 不写时挂第一张出卡的部分）；scope_note（{when: 客户原话正则, text: 系统说明}：客户原话命中时附在这一步的卡片上，
# 说明这条资料能做什么、做不到什么，系统口吻、不改原文，不新增步骤或承诺）。
bp-0123:
  1: {kind: statement}                                   # 「Identify the Problem」是标题
  3: {kind: question, options: ["Upon startup", "During breast pumping", "Only at high speed"]}
  9: {disabled: true, reason: "S1 Pro 为一体可穿戴结构，无外接软管；外接软管检查不适用（7.1 复核）"}
  10: {disabled: true, reason: "替换软管与奶瓶的交叉测试同上不适用（7.1 复核）"}
  11: {kind: handoff}
bp-0032:
  1: {kind: question, options: ["Breast shield opening", "Bottle connection"], branches: {"Breast shield opening": 2, "Bottle connection": 3}}
rv-0023:
  # 原文第 2 段「上述检查无异常且重装后仍报错 → 基站硬件问题」的前提要客户确认，不能由第 1 段的「未解决」推出（T19）；
  # 客户说还没检查 / 不知道时不能当成检查无异常（B21）
  2: {kind: question, title: "After checking the clean water tank, which matches what you see?",
      options: ["The seal ring and tank parts look fine, but the error still shows after reinstalling", "The seal ring is deformed or broken",
                "I haven't checked yet"],
      retry_options: ["I haven't checked yet"]}
rv-0063:
  # 第 3 段先问是否加过第三方清洁液（背景，不决定是否排水），再观察泡沫、有泡沫才排水换水：
  # 问句单独成卡收答案，观察与条件操作保持一张操作卡（T26）
  3:
    parts:
      - {kind: question, title: "Have you ever added third-party disinfectant or cleaning fluid directly to the base station clean water tank?",
         options: ["Yes", "No", "Not sure"]}
      - {at: "After shaking the base station's clean water tank", title: "Shake the base station's clean water tank and check for foam"}
rv-0341:
  # 一段里是噪音来源的诊断树，一个「未解决」回不了是哪一支（T36）。先问拆下滚刷和盖板后噪音怎样：
  # 消失 → 滚刷问题，进售后；吱吱声 → 试拖地模式，仍响 → 进售后；其他声音原文未覆盖 → 本指南结束，交给其他候选指南
  1:
    parts:
      - {kind: question, title: "After removing the roller brush and its cover, does the noise go away?",
         options: ["The noise is gone", "Still noisy, with a chirping sound", "Still noisy, another kind of sound"],
         branches: {"The noise is gone": s1b, "Still noisy, with a chirping sound": s1d, "Still noisy, another kind of sound": EXHAUSTED},
         default: EXHAUSTED}
      - {at: "If the noise disappears after removing the roller brush and cover", kind: statement}
      - {at: "We can resolve this by sending you a new rolling brush", kind: handoff}
      - {at: "If the noise persists after removing the roller brush and cover and sounds like", kind: action, title: "Try running the robot in mopping mode"}
      - {at: "If the noise persists even after removing the roller brush", kind: handoff}
      - {at: "Please try the suggestions in the article below", disabled: true, reason: "文章链接已作为 s1 卡的官方链接展示，这一句不单独成步骤"}
rv-0349:
  # 一段里是「试文章里的建议 + 拆下滚刷和护罩后噪音停不停 + 拍短视频」（B25 / B26），按原文顺序拆三步。
  # 问句选项与 rv-0341 第一问一致：客户在 rv-0341 答过的，fact_check 按同一事实作答，不再问第二遍
  1:
    parts:
      - {kind: action, title: "Try the suggestions in the official article"}
      - {at: "Also, please let us know whether the noise stops", kind: question,
         title: "After removing the roller brush and its cover, does the noise go away?",
         options: ["The noise is gone", "Still noisy, with a chirping sound", "Still noisy, another kind of sound"]}
      - {at: "We would appreciate a short video", kind: material_request, title: "Share a short video of the noise"}
rv-0061:
  # 整段是一封客服邮件：问候与原因说明 + 胶带临时方案 + 不想试就走保修（T32）。不拆时首句是问候语，
  # 跳过说明引用了「I hope this message finds you well」；客户「反复重装水箱」也被当成做过了这一步，胶带方案没展示
  1:
    parts:
      - {kind: statement}
      - {at: "*📝 Temporary Solution*", kind: action, title: "Fix the dirty water reservoir sensor with a piece of tape"}
      - {at: "*If you encounter any issues during the process", kind: handoff}
bp-0114:
  # 第 6 段塞了 4 个子病因（T53）：磁吸线充电；软件错误的 12 秒重置与第 2 段重复，客户已反馈过；
  # 出厂按钮损坏要先确认是到货就坏，才走官方的换机结论；电池耗尽换充电器和线
  6:
    parts:
      - {kind: action}
      - {at: "Software error", disabled: true, reason: "长按电源 12 秒重置与本节第 2 段相同"}
      - {at: "Damaged button", kind: question, title: "Was the power button already damaged when you received the pump?",
         options: ["Yes, it was damaged on arrival", "No"], branches: {"Yes, it was damaged on arrival": s6d, "No": s6e}, default: s6e}
      - {at: "Please provide your shipping address", kind: handoff}
      - {at: "Breast pump battery depleted", kind: action, title: "Charge the pump with a different charger and cable"}
rv-0473:
  # 第 4 段长按红键恢复出厂，原文没写后果；同型号 rv-0312 第 3 段写明长按红色功能键超过 5 秒会删除地图、需重新建图（T31）。
  # 「Wi-Fi 指示灯旁的红键」与 rv-0312「red function button」是否同一键原文未写明，提示用 may，待官方核实
  4: {caution: "Restoring factory settings may remove your saved map: map data is removed when the red function button is held for over 5 seconds, and you will then need to re-map the entire house."}
rv-0363:
  # 与 rv-0473 正文相同，同一处补同一条提示
  4: {caution: "Restoring factory settings may remove your saved map: map data is removed when the red function button is held for over 5 seconds, and you will then need to re-map the entire house."}
rv-0073:
  # 整条一段：装好清洁液瓶 + 试官方文章里的建议 + 拍照 / 视频（T40）。不拆时一个「未解决」就算官方排查走完，
  # 文章里的检查做没做无从知道。按原文顺序拆三步，文章链接挂在「是否已按文章检查」那张
  1:
    parts:
      - {kind: action, title: "Make sure the cleaning solution bottle is installed correctly"}
      - {at: "Also, please try the suggestions in the article below", kind: question, media: true,
         title: "Have you tried the suggestions in the official article linked on this card?",
         options: ["Yes, I tried them and it still doesn't dispense", "I haven't tried them yet"],
         retry_options: ["I haven't tried them yet"]}
      - {at: "To assist you better", kind: material_request, title: "Share a photo or video of the cleaning solution bottle"}
bp-0111:
  # 第 5 段「Check Battery Power」是「Troubleshooting Steps」下的小标题，不是操作（T51 单独出了一张四个词的卡）。
  # 改成说明，附到下一张「确保充满」卡上
  5: {kind: statement}
rv-0111:
  # 标题本身就是「Clean water tank is full but still says it's empty」，第 2 句「只是缺水提醒、方便时加水即可」对这条的读者
  # 自相矛盾（T37：满水仍报警并停拖，卡片却说这只是普通缺水提醒），且不含任何排查动作（Fable D2 2026-10-12）。
  # 拆成：查水箱有没有水、没有就加水重启（操作）→ 仍报错就联系我们（交人工）；中间那句不进卡片，原文仍在证据里
  1:
    parts:
      - {kind: action, title: "Check the clean water tank, refill if needed, and restart the task",
         scope_note: {when: "\\b(?:full|vol|voll|plein|lleno)\\b",
                      text: "You said the tank is already full. Please still check it on this card; if it's full and the message still appears after restarting, mark it as not solved and a colleague will continue from here."}}
      - {at: "*Please note that this is simply a notification", disabled: true, reason: "满水仍报缺水的读者不适用「只是缺水提醒」"}
      - {at: "*If the error persists after refilling and restarting", kind: handoff}
rv-0112:
  # 与 rv-0111 正文相同（E25），同一处理
  1:
    parts:
      - {kind: action, title: "Check the clean water tank, refill if needed, and restart the task",
         scope_note: {when: "\\b(?:full|vol|voll|plein|lleno)\\b",
                      text: "You said the tank is already full. Please still check it on this card; if it's full and the message still appears after restarting, mark it as not solved and a colleague will continue from here."}}
      - {at: "*Please note that this is simply a notification", disabled: true, reason: "满水仍报缺水的读者不适用「只是缺水提醒」"}
      - {at: "*If the error persists after refilling and restarting", kind: handoff}
rv-0312:
  # 客户问维修后能不能找回旧地图、为什么历史记录里看得到却不能用（T34）。S1 Pro 没有维修后恢复地图、历史日志的官方资料；
  # E28 的「删除后不可找回」不能借用。先如实说明这条资料能做什么，再照发查地图页 / 重建两步（Fable D4 2026-10-12）。
  # beyond_source：说明里承诺「未解决由同事核查」，指南走完按资料缺口交人工，不进质保收订单（2026-10-13 官方 63 单复评）
  1: {scope_note: {when: "(?:lost|lose|missing|recover|restore|get back|retrieve|kwijt|verloren|perdu)[^.\\n]{0,40}maps?|maps?[^.\\n]{0,60}(?:history|histor|service|repair|kwijt|verloren)",
                   text: "You'd like your old map back. I couldn't find official information on restoring a map after a repair, or on why it still shows in the cleaning history, so I can't confirm it can be recovered. The steps below check the map page and rebuilding; if you need the old map itself, mark them as not solved and a colleague will check.",
                   beyond_source: true}}
bp-0164:
  # 第 1 段「查看 App 版本」与第 3 段「提供 App 版本」是同一件事：向客户要版本号。原样是两张「是否解决」的操作卡，
  # 两次「未解决」就算指南走完、进质保，版本号从没拿到（官方 63 单 T57）。第 1 段改成问题卡收版本号（原文仍以
  # 「Check the version…」开头，选方案时把「先确认版本」认作计划内检查，不另发追问；2026-10-13 复测禁用第 1 段后
  # 2/8 次先追问版本、再发问题卡问第二遍）；第 2 段「5.0 以上可能是已知问题」附在后面；第 3 段是交给支持团队
  1: {kind: question, title: "Which version of the Anker eufy app are you using? You can find it in the app under Settings, then About or App Information."}
  3: {kind: handoff}
rv-0021:
  # 「清水不足降级为纯扫」（6536/6537）。正文后半「Please note: The alert you see is just a reminder… normal protective mechanism」
  # 讲的是机器人在没有基站的楼层、清水用完自动转纯扫；客户说水箱满着仍提示加水（T37 主轮选中这条）时，这句把异常解释成正常。
  # 拆开：查水箱 / 补水重启（操作，含同楼层仍持续请联系）→ 无基站楼层的正常保护说明（不进卡片，原文仍在证据里）
  # → 结尾「仍有问题请联系」交人工
  1:
    parts:
      - {kind: action, title: "Check the clean water tank, refill if needed, and restart the mopping task",
         scope_note: {when: "\\b(?:full|vol|voll|plein|lleno)\\b",
                      text: "You said the tank is already full. Please still check it on this card; if it's full and the message still appears after restarting, mark it as not solved and a colleague will continue from here."}}
      - {at: "Please note: The alert you see is just a reminder", disabled: true, reason: "只适用于机器人在无基站楼层用完清水；满水仍报警的客户读成「这是正常的」"}
      - {at: "If the problem continues after refilling the water", kind: handoff}
