T31:
  title: S1 Pro已擦触点仍不能充电
  customer_zh: S1 Pro，T2080A，在站仍不充，电气接点已经擦净，机器人一直极低电量。
  turns_zh:
  - 检查基站是否通电，屏幕及水箱内指示灯是否正常亮起。首卡承接“在基站不充电、电量极低、已擦过电连接触点”；部分检查可能重复，若确已按同样方式做过仍异常可选未解决。
  - 如果基站未通电，尝试其他插座，检查基站背面的电源线是否接牢；松动可能使基站无法供电。
  - 擦拭机器人和基站的充电针脚，确保无污物。
  - 长按Wi-Fi指示灯旁红色按钮恢复出厂，把机器人放在基站并确保充电针脚对准，等待5分钟。注意：恢复出厂可能删除保存的地图；长按红色功能按钮超过5秒会删除地图，需要重新绘制全屋地图。
  - 官方排障已完成，但问题仍未解决，下一步进入售后审核；是否保修需继续核查。请提供订单号；其他卖家购买则上传含卖家、购买国家和购买日期的凭证。
T32:
