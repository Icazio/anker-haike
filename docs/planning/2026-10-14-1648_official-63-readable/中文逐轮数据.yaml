T11:
  title: S1 Pro加清水报EB1L
  customer_zh: S1 Pro，PN T2080A，SN 12345678A，报码21037332/EB1L：机器人加清水出错、任务结束，要求联系客服。无附件。
  turns_zh:
  - 从基站取出清水箱，检查出水孔密封圈是否安装正确；用手电照水箱管路，看内部管子是否损坏。卡片附密封圈和水管示意图。
  - 加清水至最高水位线，并确保水箱牢固放入基站。
  - 检查机器人进水口是否有杂物或堵塞，用纸巾或棉签清理；附进水口示意图。
  - 报错后把机器人移离基站，检查基站注水口橡胶塞处有无水，并看胶塞是否损坏或缺失；附图。
  - 将固件更新到7.0.143或更高版本。
  - 官方排障已完成，但问题仍未解决，下一步进入售后审核；是否保修需继续核查。请提供订单号；其他卖家购买则上传含卖家、购买国家和购买日期的凭证。
T12:
  title: E25缺清水后变成只吸尘
  customer_zh: Omni E25，PN T2353：因为清水不足，清扫切换为仅吸尘以完成任务。
  turns_zh:
  - 检查基站清水箱；若空了就加水并重新开始清洁。如果机器人在与基站同一楼层启动，加水并新建拖地任务后仍出现问题，联系支持。卡片回显“清水不足转只吸尘”的描述，说明如已经按相同步骤检查且仍异常，可选未解决。
  - 官方排障已完成，但问题仍未解决，下一步进入售后审核；是否保修需继续核查。请提供订单号；其他卖家购买则上传含卖家、购买国家和购买日期的凭证。
T13:
  title: E25报5116通信错误
  customer_zh: 荷兰语：Omni E25，T2353，5116通信异常，机器人与基站通信失败，要求联系客服；SN空，无附件。
  turns_zh:
  - 未能确认针对这个问题的官方排障指引，已把问题和支持资料提交同事审核；等待期间可继续补充信息。
T14:
  title: E28墙面传感器报4090
  customer_zh: Omni E28，T2352，4090传感器异常：墙传感器不工作。SN空，原文有图片链接，本轮发送T14.jpg。
