  turns_zh:
  - 系统先为体验致歉。订单Anker004：Australia Post的Anker1234567-5于2026-09-20送达，包含T2353T11、T29YQA20。系统称按政策不能直接补发，若实际没收到可提交承运商调查，展示待确认方案。
