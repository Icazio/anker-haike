  customer_zh: S1 Pro，T2080A，维修寄回后首次使用发现地图丢失，建图很费力；历史记录中仍可看却不能用，十分沮丧。
  turns_zh:
  - 系统致歉，明确知道客户想找回旧地图；未找到维修后恢复地图或历史里仍看得到的官方说明，不能保证能恢复。下面只是检查地图页及重建备选；如果仍要旧地图，可反馈未解决让同事核查。保留维修回来首次使用、地图丢失、历史可见却不能用的信息。第一步：在地图管理页面寻找对应地图。
