  customer_zh: 荷兰语：Omni E28，T2352洗拖布总提示加水，清水箱明明满水，随后仅吸尘。水箱管与橡胶圈都正常，怎么办？
  turns_zh:
  - 系统明确承接“水箱已经满了”，要求按本卡复核；若水满且重启后仍提示缺水，反馈未解决后由同事继续。也保留改为仅吸尘、软管正常、胶圈正常的信息。操作：检查基站清水箱，只有为空才加水，再重启拖地；若在基站同楼层开始任务，加水并重启仍无效，联系支持。
  - 官方排障已完成，但问题仍未解决，下一步进入售后审核；是否保修需继续核查。请提供订单号；其他卖家购买则上传含卖家、购买国家和购买日期的凭证。
T38:
