T51:
  title: 泵充过电仍中途关机，订单已过保
  customer_zh: 乳泵充过电却电池撑不住，使用中不断关机，订单Anker014，希望可能更换。
  turns_zh:
  - 系统宣布先更换申请、后设备排障。查到Anker014质保到2026-07-30，截至2026-10-14已过保，按当前政策不能免费换货或退款，可看保养说明或咨询购买配件，仍可做官方排查。第一步：对齐充电针与磁吸接口，应听到咔嗒并看到白灯闪烁。保留已充电、不存电、使用时关机的描述，并说明复核方式。
  - 确认充电时长：泵充满约1.7小时，盒充满约3.2小时；盒内指示灯常亮后10分钟熄灭，表示泵已充满。
  - 尝试更换充电器和线缆，并用磁吸线直接充电。
  - 检查磁吸充电头有无杂物，清洁后试另一个盒；长按电源键12秒复位。
  - 案件已结束，但问题没有解决；没有提交新的服务申请。
T52:
