T1:
  title: 只收到配件，没有收到吸尘器
  customer_zh: 主机没有到，只收到了替换配件包。主机发货了吗？该怎么办？订单Anker001。
  turns_zh:
  - 系统先为体验致歉。订单Anker001：Fedex运单Anker1234567于2026-09-21送达；Amazon Logistic运单Anker1234567-1于2026-09-23送达，两项均显示E235311B。系统称按售后政策，记录已送达时不能直接补发；如实际未收到，可提交承运商调查，由同事核查。展示“提交承运商调查申请”方案，等待确认。
T2:
  title: 收到的包裹与订单记录对不上
  customer_zh: 订单Anker002今天收到运单-2的配件包，S1主机未到。UPS的-3只显示创建标签，没有后续。何时收到主机？
  turns_zh:
  - 订单Anker002：ANPOST的Anker1234567-2在2026-09-21送达，记录SKU为T2080GA1；UPS的Anker1234567-3在2026-09-24送达，记录SKU为T29C2001。系统说明“-2”记录的是主机，与客户称收到配件不符；两边陈述均已保留，请确认各包裹装了什么，可提供箱标供同事与承运商核查。
T3:
  title: 询问购买的X10什么时候寄出
  customer_zh: 商品为X10 Pro Omni、8000Pa、品相可接受。请问订单Anker003何时寄出？
  turns_zh:
  - 订单Anker003：Royal Mail运单Anker1234567-4于2026-09-25送达，SKU为T2351V11-F。系统说明按当前售后政策，已送达记录不能直接补发；若实际未收到，可提交承运商调查，并展示等待确认的调查方案。
