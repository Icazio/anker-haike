  turns_zh:
  - 接上电源后，充电盒本身能否开机并充电，还是盒本身完全充不进电？
T53:
  title: 现在过保，但客户称保内就已经坏了
  customer_zh: Anker015，S1 Pro乳泵一侧停机，反复充电仍不开机。买了24个月，故障在12个月内发生，当时不知道能申请，希望更换或维修。SN字段填T8D04121，2026-09-27提交，附T53.jpg。
  turns_zh:
  - 系统宣布先更换申请、后排障。查到Anker015质保到2025-12-13，截至2026-10-14已过保，按当前政策不能免费更换或退款，可看保养说明或咨询配件，仍可排障。保留“一边停止工作、不开机、反复充电”的描述。第一步：长按电源键12秒复位，再试能否开机。
  - 确认充电盒内部指示灯及吸奶器指示灯都点亮。
  - 换一个充电盒给吸奶器充电。
  - 确保吸奶器与充电盒接触良好。
  - 尝试磁吸充电线充电。
  - 电源键是否收到产品时就损坏？选项“是，到货就坏”“否”。资料说明出厂按钮损坏可能与运输有关。
T54:
  title: S1 Pro无吸力
  customer_zh: S1 Pro乳泵没有吸力。
  turns_zh:
  - 检查鸭嘴阀和隔膜有无裂纹、缺口、孔洞、撕裂；损坏则停用该部件并购买替换件。
  - 检查组装正确，鸭嘴阀、喇叭罩通道、隔膜、泵主机四部分密封良好。
  - 调整佩戴，使乳头位于喇叭罩通道中心，不折叠、不受压，泵与胸部密封并能感到明显吸力。
  - 不同喇叭罩或内衬尺寸影响舒适度和吸力，尝试适合自身的尺寸。
  - 把吸力调至自己舒适范围内的最高档。
  - 同时长按电源键与加号键约5秒恢复出厂设置，再试；仍有问题进入下一步。
  - 取下主机头，让吸气口对着手掌，启动后测试有无吸力。有明显吸力说明主机正常，问题可能在其他部件，例如软管或吸奶器罩；没有吸力则还需排查。
  - 官方排障已完成，但问题仍未解决，下一步进入售后审核；是否保修需继续核查。请提供订单号；其他卖家购买则上传含卖家、购买国家和购买日期的凭证。
T55:
  title: 左泵咔嗒响但无吸力，附购买截图
  customer_zh: Amazon/RMA Anker016，S1 Pro乳泵用了不足三周，左泵咔哒响但没吸力；拆看隔膜仍坐好，部件只手洗。只能右泵轮流用两边，非常失望；2026-09-27提交，附T55.jpg。
  turns_zh:
  - 系统致歉，要求同时按电源键和加号键约5秒恢复出厂设置，恢复后再试，无效进入下一步。卡片回显左边咔嗒响无吸力、隔膜在位且一直手洗。
  - 取下主机头，吸气口对手掌，启动测试吸力；有明显吸力则资料认为主机正常，可能是其他部件（原文举软管或泵罩），无吸力则需继续排查。
  - 检查鸭嘴阀、隔膜的裂纹、缺口、孔洞和撕裂；损坏则停用并更换。确认鸭嘴阀、喇叭罩通道、隔膜、主机装配密封。
  - 已查Anker016保修至2027-04-01。在提交更换申请之前，还需故障照片或视频、产品序列号SN；请上传媒体并回复其他信息。
T56:
  title: 摄像头老离线，客户已经很生气
  customer_zh: SoloCam S340装上一周仍在需要时离线，客户质问保修并表达强烈不满。
  turns_zh:
  - 系统为困扰致歉。检查摄像头电池，电量低则充电。
  - 检查是否关机：按下并松开SYNC键；灯不亮时，在摄像头设置里开机，或“按住摄像头2秒”启动。
  - 理解已花费很多时间；可以现在为支持团队准备摘要，请回复“human agent（人工客服）”；想继续下一步官方检查，则回复“continue（继续）”。
T57:
  title: 多个摄像头不录像，先收App版本
  customer_zh: 除一台外摄像头都不能工作，系统不再录像，客户说Wi-Fi没问题，认为系统改动导致。
  turns_zh:
  - 系统先致歉。你使用哪个版本的Anker eufy App？可在App“设置→关于/应用信息”查看，请回复版本信息。这是问题卡，没有“已解决/未解决”动作可替代版本号。
T58:
  title: 只表达愤怒，没有具体故障
  customer_zh: 客户只用粗口批评摄像头很差，没有具体症状。
  turns_zh:
  - 为设备问题致歉。请描述设备具体表现或App中的错误，我会查官方指引；若更愿意由人帮助，可以为支持团队准备摘要。
T59:
  title: 两个S340不稳定，想换成便宜的C20摄像头
  customer_zh: 两台SoloCam S340不断断连、不可靠，便宜的SoloCam C20反而正常，希望把两台换成C20。
  turns_zh:
  - 系统为体验致歉。为核保需订单号；若从其他商家购买，请上传商家、国家和购买日期齐全的凭证。若希望人工协助，回复“human agent”，系统会整理材料。
T60:
  title: 骂App难用，只想让机器清洁
  customer_zh: 客户辱骂App，只想吸尘器正常清扫，没有具体型号或故障表现。
  turns_zh:
  - 为设备问题致歉。请描述它的具体表现或App报错，我会查官方指引；若想由人工帮忙，可为支持团队准备摘要。
T61:
  title: 提前两小时启动，App没有清扫记录
  customer_zh: Omni C20提前两小时启动，不按计划，App也没有记录清扫。
  turns_zh:
  - 系统致歉，说明未能确认适用于“提前两小时启动”和“App不记录清扫”这两项问题的官方指导；已分别保留问题并提交同事复核，等待期间可继续补充信息。
T62:
  title: 清洁路线不直，先问是否重复覆盖
  customer_zh: Omni C20为什么不走直线？便宜的另一台机器人更好，这台从第一天就表现差。
  turns_zh:
  - 系统为体验致歉。机器人是否反复清洁同一个区域，或者清洁路线相互重叠？
T63:
  title: 滚刷盖卡扣坏，找不到配件
  customer_zh: 买不到此型号滚刷护盖，只好胶带粘住；卡扣容易断，清扫差、防缠绕也不正常，请帮忙。
  turns_zh:
  - 系统为体验致歉，宣布先处理“购买配件”，再处理“设备排障”；如需人工可回复“human agent”。随后说明当前不能查配件库存或下配件订单，已将滚刷护罩需求交给同事核查。
