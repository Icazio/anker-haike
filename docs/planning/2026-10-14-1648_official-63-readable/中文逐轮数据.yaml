T29:
  title: 托盘不排水，清理和管路检查都做过
  customer_zh: Amazon/RMA订单Anker011，X10 Pro Omni，水盘不能排水；已清洁，软管未夹、污水箱下接头未被压下，污水箱空。还能做什么？SN空，9月3日提交。
