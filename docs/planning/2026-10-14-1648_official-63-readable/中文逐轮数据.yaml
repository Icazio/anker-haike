T17:
  title: E28便携清洁机位置异常
  customer_zh: Omni E28，T2352，6063：便携深度清洁器放置不正确，SN空，无附件。
  turns_zh:
  - 提起便携深度清洁机，按基站微动开关，看是否能正常压下、回弹；放回设备，用手按污水箱保证到位。注意收好软管，避免夹电源线或放置时碰墙；附取放视频。卡片回显原故障描述。
  - 检查基站电源插头是否插牢，供电松动可能被误判为清洁机放置不到位。卡片仍提醒收好软管、防夹电源线、避免碰墙，并附电源图。
