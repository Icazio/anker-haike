T9:
  title: 询问发货，并要求没发就先别发
  customer_zh: 7日购买的订单Anker008只收到滤芯。若主机没发，请先别发，先谈其他产品；为什么延迟没有通知？
  turns_zh:
  - 系统致歉，说明按“修改订单→配送状态”处理。它不能自行修改或暂停订单，已交同事，订单可能仍在处理。随后报告：T2292111主机预售、尚未发货，原预计2026-10-20发出；US
    YANWEN运单Anker1234567-10的T290Y000于2026-09-12送达。是否暂停或取消，由处理请求的同事决定。
