T15:
  title: S1 Pro基站集尘通道堵塞
  customer_zh: S1 Pro，T2080A，SN 12345678D，21037059/EB03：基站集尘风道堵塞、任务结束。
  turns_zh:
  - 取下清水箱，打开尘袋盖，确认尘袋已正确安装；取出尘袋看集尘口是否堵塞，有堵塞就手动清理。附尘袋及集尘口图。
  - 取下机器人的磁吸盖和尘盒，查看尘盒是否满、入口是否被异物堵住；如有则清理。附尘盒与滤网图。
  - 检查基站集尘入口有无异物，发现后清理。附图。
  - 取下基站清水箱和污水箱，翻转基站，拧下透明盖上的两颗螺丝，移开白色胶塞，查看集尘通道是否堵塞。附底部通道图。
  - 官方排障已完成，但问题仍未解决，下一步进入售后审核；是否保修需继续核查。请提供订单号；其他卖家购买则上传含卖家、购买国家和购买日期的凭证。
