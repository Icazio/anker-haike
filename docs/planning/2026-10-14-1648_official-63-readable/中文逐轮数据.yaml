T19:
  title: X10清水不足，需要客户确认检查结果
  customer_zh: X10 Pro Omni，T2351，6011：基站清水箱水不足，请加水放回；SN空。
  turns_zh:
  - 检查清水箱部件，箱内有水时先倒空；查看出水口密封圈是否装好、有无变形破损。如有缺陷，另行上传照片。卡片明确照片与本次反馈分开，不必等照片才能回答是否解决。
  - 请选检查结果：①密封圈和水箱部件看起来正常，重装后仍报错；②密封圈变形或损坏；③还没检查。说明只有相关部件、基站密封圈和安装均正常而仍报错时，才按资料判断基站硬件问题。
T20:
  title: X10无法定位，任务终止并回站
  customer_zh: 荷兰语：X10 Pro Omni，T2351不能定位，任务结束并回基站；本轮附T20.jpg。
  turns_zh:
  - 出现这个提示，可能是家庭环境或基站附近环境变化较大，与已有地图差异造成定位失败。请重新建图并开始新任务，确认提示是否消失。
