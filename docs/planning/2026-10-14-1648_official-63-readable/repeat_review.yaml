T20:
  note: 两次都只给重建地图文字后结束，无操作反馈卡；流程缺陷重复出现。
  turns_zh:
  - 系统解释可能是环境或基站附近变化较大，与现有地图差异导致定位失败。要求重建地图、重新开始任务验证，但直接结束。
T29:
  note: 首次仅问托盘格栅；补测走完整排水检查，并对已做事项作承接。说明路线和承接有波动，补测不能替换首次体验。
  turns_zh:
  - 系统保留托盘不排水、已清理、软管无折弯、接头未下陷和污水箱空的信息；说明复核可能重叠，已做且无效可反馈。第一步检查污水箱放在基站时盖锁是否扣紧。
  - 检查清洗托盘格栅是否被沉积物或异物堵住，并清理托盘。
  - 若仍抽不出污水，按住污水箱盖并在App启动洗拖布；如果此时能抽水，说明密封圈可能异常。检查是否局部塌陷，如有，向外拉平到与其他部位齐平。
  - 订单Anker011质保到2025-11-30，截至2026-10-14已过保，不能按当前政策免费换货或退款；可查看保养说明，或咨询购买配件。
T40:
  note: 两次都用清洁剂rv-0073，不再误选清水；停在外链文章是否尝试的事实问题。本轮未覆盖客户回答后的分支。
  turns_zh:
  - 系统展示产品候选卡，等待确认具体产品；测试按工单产品列选择S1 Pro机器人T2080。
  - 系统承接清洁剂液位几乎不变，说明复核可重叠。第一步确保清洁剂瓶正确安装。
  - 请尝试链接文章的建议，并选择“做过但仍不分配”或“还没尝试”。测试不代答，停在问题卡。
T41:
  note: 首次问6014代码，补测问是否更新最新固件；两次都保留配送待处理任务，尚未执行到物流。只能判断追问路径有差异，不能断言所有后续诉求已经遗漏。
  turns_zh:
  - 系统致歉，说明先设备排障后配送查询，然后问最近是否更新到最新固件。
T42:
  note: 两次内部读图都把手持塑料件与机身混成主体。客户可见回复均按物理损坏收售后资料，流程合理，关键证据质量仍不合格。
  turns_zh:
  - 根据客户描述的损坏，常规排障不能修复，下一步售后审核；是否保内需核查。请提供订单号，其他商家购买则上传含商家、国家和购买日期的凭证。
T43:
  note: 两次第四步都以普通文字输出后立即说排障完成，没有收到第四步结果；空尖括号和英语回复也重复出现。
  turns_zh:
  - 检查网络是否2.4GHz；设备不支持5GHz，必要时切换，原卡链接位置显示空尖括号。提示大房子局部信号差会离线，但按该官方条目可继续清扫、回到覆盖区后自动重连并显示路径。
  - 确认Wi-Fi密码，可从手机设置复制，或用手机热点测试；设备支持用户名密码模式，不支持网页Portal认证。重复给出网络覆盖提示。
  - 确认网络良好，把机器人、路由器和手机放近以保证信号。重复给出网络覆盖提示。
  - 系统又建议重启路由器和设备并重新配网，却同时宣布官方排障完成、问题仍未解决，要求订单号或购买凭证进入售后；没有等待这项新操作的反馈。
T48:
  note: 两次都问灯是否闪烁，但也都错误声称官方没有绿灯解释。官网图表已核实，知识覆盖与回答范围问题重复出现。
  turns_zh:
  - 系统问产品类型和型号，可提供铭牌型号。测试随后仅按工单产品列补“S1 Pro吸奶器，T8D04”。
  - 系统描述电源键左侧绿灯、左下三颗黄灯、触点上方裂纹，不推断裂纹导致灯态。随后称官方只说明红灯及白色/交替灯，没有此位置绿灯含义；建议看手册或App并确认常亮还是闪烁、何时出现。该资料断言不准确。
T51:
  note: 首次用充电故障条目，补测用使用时关机条目，两次都有相关检查且明确过保。补测没有走到旧条目里可疑的蓝牙步骤，不能据旧报告断言本轮用了蓝牙排障。
  turns_zh:
  - 先更换申请后排障。Anker014质保到2026-07-30，截至2026-10-14已过保，不能免费更换退款，但仍可排查。保留已充电、存不住电和使用中关机的信息。先确认足够电量，用原装充电器线缆或5V/2A适配器充至少30分钟；检查指示灯，尝试换盒并清洁磁吸触点。
  - 长按电源键12秒复位；无效时同时按电源键与加号5秒恢复出厂设置。
  - 检查按钮卡住、进水或操作无响应；确认在正常室温、10摄氏度以上和稳定电压条件下使用。
  - 系统明确案件已结束但问题未解决，没有提交新的服务申请。
T52:
  note: 首次只是重复询问盒能否充电；补测却采用泵不能开机条目bp-0114，连续做泵复位和换盒，再问泵按钮到货时是否损坏，偏离充电盒自身受电故障。这是补测新增的明确意图/对象错误，首次分类不回填。
  turns_zh:
  - 系统显示“吸奶器不能开机”上下文，要求长按电源键12秒复位并试开机；没有先解决盒本身充不进电。
  - 确认充电盒内部及吸奶器指示灯都亮。
  - 把吸奶器放入另一个充电盒尝试充电。
  - 确认吸奶器与充电盒接触良好。
  - 尝试磁吸充电线充电。
  - 询问吸奶器电源键是否到货时已损坏，选项“到货时已坏”或“没有”；测试停止，不代选。
T53:
  note: 两次都没有专门回应保内故障、过保才申报，末尾到货按钮问题也相同；需要官方例外政策与系统诉求承接共同改进。
  turns_zh:
  - 先更换申请后排障。Anker015质保到2025-12-13，截至2026-10-14已过保，不能免费更换退款；可看保养说明或咨询配件，仍可排查。保留一边停机、反复充电不开机的信息，第一步长按电源键12秒复位。没有单独回答迟报申诉。
  - 确认盒内与吸奶器指示灯都亮。
  - 尝试把吸奶器放入另一个充电盒充电。
  - 确认泵与盒接触良好。
  - 尝试磁吸线充电。
  - 询问电源键到货时是否已坏，选项“到货时已损坏”或“没有”，停在未知事实。
T61:
  note: 首次完整保留两项问题转人工，补测却问计划开始时是否低电量。提前启动与到点不启动是相反时序；本轮已证实随机路径仍可能选错追问。
  turns_zh:
  - 系统致歉，然后问：在计划清扫本应开始的时候，机器人的电量是不是很低？
T63:
  note: 两次都只对护罩采购给出人工出口，清扫和防缠绕异常留在待处理任务，未向客户交代接续方式。应保留边界但补全交代。
  turns_zh:
  - 系统致歉，宣布先配件采购后设备排障，提供人工关键词。随后说明无法查询配件库存或下单，已把滚刷护罩需求交给同事核查。
