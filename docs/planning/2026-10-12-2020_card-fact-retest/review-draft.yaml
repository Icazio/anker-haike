T1:
  original_zh: 主机没有到，只收到了替换配件包。主机发货了吗？该怎么办？订单Anker001。
  turns_zh:
  - 列出FedEx主运单9月21日妥投、Amazon另一票9月23日妥投，二者均关联E235311B。依据妥投政策不直接补寄，提出承运商调查，等待客户确认；未提交调查。
  title: 只收到配件，主机没到
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 系统查出两件包裹均签收，提供承运商调查入口，没有把签收当作用户实际收到主机。当前停在客户确认申请；仍可改进为逐箱确认主机与配件，避免泛称这个包裹。
  next: 客户确认后由人工核实箱内物品和承运商交付，不承诺主机已补发。
T2:
  original_zh: 订单Anker002今天收到运单-2的配件包，S1主机未到。UPS的-3只显示创建标签，没有后续。何时收到主机？
  turns_zh:
  - 列出-2对应主机9月21日妥投、-3对应配件9月24日妥投。明确订单记录与客户收到的物品冲突，保留双方说法，请核对每箱物品和标签供同事调查。
  title: 运单显示与收到的箱内物品矛盾
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 系统明确保留后台记载主机与客户称收到配件的冲突，并请核对箱标。订单记录不是实物交付证明；这一步比照着后台直接否定客户更合理。done只表示本轮回复结束。
  next: 收集两箱标签与物品对应关系后交人工核验；当前尚未查明主机去向。
T3:
  original_zh: 商品为X10 Pro Omni、8000Pa、品相可接受。请问订单Anker003何时寄出？
  turns_zh:
  - 查询Royal Mail运单-4，记录9月25日妥投；提出承运商调查，等待确认，未编造新的发货日。
  title: 客户问何时发货，记录已签收
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 告知实际记录和日期，并以确实未收到为条件提供调查，没有编造发货日期。可先确认是否收到，减少无关售后政策文字。
  next: 等客户核对收货情况，再决定是否提交调查。
T4:
  original_zh: 9月14日按1–3个工作日配送买机器人，澳邮说9月30日前不跟进。我以前在Good Guys买过，很喜欢产品，后悔这次从官网买。订单Anker004，希望尽快调查。
  turns_zh:
  - 待补译
  title: 配送超过承诺时间，客户要求调查
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 承接不满、给出记录并提供调查入口，没有承诺可控制澳邮或保证赔付。
  next: 人工核验客户投诉时间与签收记录；本轮没有真实联系承运商。
T5:
  original_zh: 请更新订单Anker005的配送进展。
  turns_zh:
  - 订单Anker005：主机FedEx运单-6在途，预计2026-09-30到；配件USPS运单-7已于2026-09-15妥投。主机超过预计日期仍未送达，按政策可申请补寄，提交后由同事安排。当前补寄方案待确认，尚未提交补寄申请；原包裹已经在途。
  title: 两件包裹一件到达，一件逾期
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 区分在途和已签收包裹，对截至测试日已过预计日期的包裹提出补发申请，并说明由同事办理。没有把申请等同实际发货。
  next: 客户确认补发对象后进入人工履约。
T6:
  original_zh: 荷兰语邮件转发“订单Anker006已发货”。上周买的机器人仍未收到。
  turns_zh:
  - 待补译
  title: 荷兰语问机器人未收到
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  - Agent边界
  why: 物流方向正确，但客户主要用荷兰语，系统回复和确认卡均为英语。邮件签名含英语不等于客户要求改用英语。
  next: 按客户正文语言翻译回复和按钮，保留原始运单数据。
T7:
  original_zh: 输入追踪号码查订单却查不到，什么时候能收到？正文没有提供号码本身。
  turns_zh:
  - 请求订单号或运单号后再查询，未猜测任何标识或到货时间。
  title: 追踪号码查不到，但没提供号码
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 先索取订单号或运单号，既没有凭空查单，也没有用工单标签中的信息冒充客户提供的事实。
  next: 等客户提供号码后查单；没有必要调用故障知识库。
T8:
  original_zh: 订单Anker007的吸尘器没收到，何时到？
  turns_zh:
  - USPS-9显示退回寄件人，提出补寄申请，等待确认。
  title: 包裹被退回，客户问何时收到
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 按退回寄件人的记录提供补发申请入口，等待确认且说明人工办理，没有虚构新的到货时间。
  next: 确认后由人工安排补发。
T9:
  original_zh: 7日购买的订单Anker008只收到滤芯。若主机没发，请先别发，先谈其他产品；为什么延迟没有通知？
  turns_zh:
  - 对体验致歉，按订单变更→物流处理。自己不能暂停/更改订单，已交同事处理，订单可能已在流程中。Anker008主机T2292111为预售未发，原预计2026-10-20发货；滤芯T290Y000的US YANWEN运单-10于2026-09-12妥投。是否暂停或取消由同事确认，未声称暂停成功。
  title: 主机未发，客户要求先暂停订单
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 同时识别订单变更和物流查询，优先转交暂停请求，再说明主机预售、配件已到。明确暂停或取消要由同事决定，没有承诺已经拦截。
  next: 人工落实暂停或改购意向；不能仅凭系统转交事件认定仓库已停发。
T10:
  original_zh: 订单Anker009的C10主机仍没收到，何时到？
  turns_zh:
  - 待补译
  title: C10主机未收到，记录已签收
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 给出两条物流记录并提供调查。承运商签收与客户收到目标商品仍需核验，系统未直接承诺再次发货。
  next: 核对C10对应箱件和投递证据。
T11:
  original_zh: S1 Pro，PN T2080A，SN 12345678A，报码21037332/EB1L：机器人加清水出错、任务结束，要求联系客服。无附件。
  turns_zh:
  - 取出基站清水箱检查出口密封圈，手电检查水箱内管有无破损；提供两张示意图。
  - 模拟未解决后，加水至最高水位，确保水箱放稳。
  - 模拟未解决后，检查机器人注水口的异物/堵塞，以纸巾或棉签清理；提供图示。
  - 模拟未解决后，移开机器人，检查基站注水口胶塞是否有水、破损或缺失；提供图示。
  - 模拟未解决后，更新固件至7.0.143或更高版本。
  - 说明官方排查已完成仍未解决，下一步售后审核，是否保修须核验。模拟未解决后索购买材料核资格。
  title: S1 Pro加清水失败，报码EB1L
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 按明确错误码依次发出五个官方检查步骤，模拟反馈均未解决后才收购买资料。未把检索成功或步骤发完称为修复成功。
  next: 真实客户完成检查后反馈；仍失败则核验购买资格并人工处理。
T12:
  original_zh: Omni E25，PN T2353：因为清水不足，清扫切换为仅吸尘以完成任务。
  turns_zh:
  - 给出rv-0021：检查基站水箱，空则补水后重启；同楼层补水仍异常可求助；无基站楼层缺水切仅吸尘是正常保护。条件原样保留在一张操作卡。
  - 说明官方排查已完成仍未解决，下一步售后审核，是否保修须核验。模拟未解决后索购买材料核资格。
  title: 清水不足后自动切为仅吸尘
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 卡片说明补水重启，并保留无基站楼层下切换吸尘是保护行为这一条件。整段文字较长，可拆成先问楼层和补水结果，但本次没有直接判硬件损坏。
  next: 实际服务中确认基站所在楼层及补水结果，避免把正常保护行为当故障。
T13:
  original_zh: 荷兰语：Omni E25，T2353，5116通信异常，机器人与基站通信失败，要求联系客服；SN空，无附件。
  turns_zh:
  - 未能确认适用于此问题的官方排障指导，已提交问题与相关信息供同事复核；等待期间可以继续补信息。
  title: 5116通信错误缺少已确认官方指导
  verdict: 需要改进
  flow: 合理
  tags:
  - 知识资料缺口
  - Agent边界
  - 语言表达
  why: 对没有确认到官方排障的5116转人工是合理边界；不足是荷兰语输入收到英语回复，以及现有资料缺少该错误码指引。不能把没有可靠资料解释成Agent应该自行编步骤。
  next: 由知识维护人员向厂商补齐5116指导；回复改荷兰语，人工审核期间允许补材料。
T14:
  original_zh: Omni E28，T2352，4090传感器异常：墙传感器不工作。SN空，原文有图片链接，本轮发送T14.jpg。
  turns_zh:
  - 按该报码官方资料判为硬件故障，下一步售后评估；明确是否在保取决于后续核验，索订单号或购买凭证。
  title: 4090墙传感器异常
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 硬件售后方向来自错误码官方指导，照片本身只能看到机器和红灯，不足以诊断墙传感器。系统按码收资格材料，没有继续无依据排障。
  next: 核验购买资料后由售后检查硬件；无需强行调用远程检索。
T15:
  original_zh: S1 Pro，T2080A，SN 12345678D，21037059/EB03：基站集尘风道堵塞、任务结束。
  turns_zh:
  - 取清水箱、打开尘袋盖，确认尘袋安装；取尘袋检查尘口，堵塞时手动清理；附图。
  - 模拟未解决后取机器人磁吸盖与尘盒，检查满尘/吸口异物，有堵塞则手动清理；附图。
  - 模拟未解决后检查基站吸入口，堵塞则清理；附图。
  - 模拟未解决后取清水和污水箱，翻基站，卸透明盖两螺钉、取白胶塞，检查集尘通道异物；附图。
  - 说明官方排查已完成仍未解决，下一步售后审核，是否保修须核验。模拟未解决后索购买材料核资格。
  title: EB03基站集尘风道堵塞
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 依次检查尘袋、机内尘盒、基站入口和底部通道，来源明确，未解决后收购买资料。翻转和拆两颗螺丝来自官方步骤，不是模型追加拆机。
  next: 实物操作仍须按官方说明进行；本测试只检查步骤顺序与终点。
T16:
  original_zh: X10 Pro Omni，T2351，2310提示尘盒/滤网未安装；客户补充已经完全装好且清洁。
  turns_zh:
  - 待补译
  - 如果滤网安装正确，进一步检查图示位置是否有磁铁，附磁铁位置图；做完反馈问题是否解决。
  - 说明官方排查已完成仍未解决，下一步售后审核，是否保修须核验。模拟未解决后索购买材料核资格。
  title: 尘盒和滤网明明装好却仍报码
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 安装检查照发，首卡引用已装好且干净并说明可确认已做步骤，随后检查磁铁。按客户接受的确认方式，这不是不听客户说话；比上轮多一轮确认，但未见错误跳步。
  next: 检查磁铁结果仍异常时收购买材料继续售后。
T17:
  original_zh: Omni E28，T2352，6063：便携深度清洁器放置不正确，SN空，无附件。
  turns_zh:
  - 提起便携清洁器，按基站微动开关检查能否下压回弹，再放回并手压污水箱确认放好；附视频，提醒收好软管、不夹电源线或碰墙。
  - 模拟未解决后检查基站电源插头是否插牢；保留放置注意事项，附图。
  - 说明官方排查已完成仍未解决，下一步售后审核，是否保修须核验。模拟未解决后索购买材料核资格。
  title: 6063便携清洁器放置异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 按错误码检查微动开关、放置情况和电源连接，保留软管与电源线注意事项；没有因为缺SN就阻止基础排障。
  next: 实际检查仍失败后核验资格。
T18:
  original_zh: 荷兰语：新开箱Omni E28，T2352，3212滚筒拖布卡住；保护贴都已移除，仍提示堵塞。
  turns_zh:
  - 取污水仓，检查滚筒是否缠绕绳、电缆、塑料袋、毛发，清异物；视频说明安装时一声卡扣响表示到位，任务前收线。
  - 说明官方排查已完成仍未解决，下一步售后审核，是否保修须核验。模拟未解决后索购买材料核资格。
  title: 新机已撕保护贴，仍提示滚拖堵塞
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  why: 撕掉保护贴不等于确认滚筒无异物，检查滚筒仍合理；系统没有强迫重撕贴纸。但荷兰语诉求对应英语卡片和收资料回复，影响使用。
  next: 保留滚筒检查流程，按荷兰语输出含注意事项的卡片。
T19:
  original_zh: X10 Pro Omni，T2351，6011：基站清水箱水不足，请加水放回；SN空。
  turns_zh:
  - 检查清水箱部件：箱内有水先倒掉，确认出口密封圈安装正确且无损；若变形或破损请提供照片。操作结果与照片可分别提交。
  - 询问清水箱检查结果：密封圈及部件正常但重装仍报码；密封圈变形或损坏；尚未检查。说明只有水箱部件、基站密封和安装均无异常、重装仍报错时才可按源文判断基站硬件问题。等待选择或文字回答。
  title: 6011清水不足，需判断是否水箱问题
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 检查水箱后停在明确选项：部件正常仍报码、密封圈破损、尚未检查。未凭测试器一句未解决就断言所有前提满足或硬件已坏。
  next: 等客户选择真实检查结果后再走对应分支；停止属于缺事实，不能算知识不执行。
T20:
  original_zh: 荷兰语：X10 Pro Omni，T2351不能定位，任务结束并回基站；本轮附T20.jpg。
  turns_zh:
  - 待补译
  title: 无法定位并回基站，附摆放照片
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  - Agent边界
  why: 先确认机器人与基站是否同一楼层，这个事实不能由一张基站摆放图推出。本轮没有看到错误安全转人工；不足是荷兰语输入仍用英语追问。
  next: 等客户回答楼层关系；同时检查视觉摘要及后续节点，不能把历史误触发算到本轮。
T21:
  original_zh: 法语：X10 Pro Omni，T2351，两周无法工作，总提示激光传感器堵塞；已多次清洁和重启，报码仍出现。
  turns_zh:
  - 待补译
  - 试着手动转动雷达，看是否顺畅；再翻转机器人并轻敲雷达，检查有无颗粒掉出。做完后反馈是否解决。
  - 将机器人放在平地，重启再试；反馈问题是否解决。
  - 说明官方排查已完成仍未解决，下一步售后审核，是否保修须核验。模拟未解决后索购买材料核资格。
  title: 已反复清洁和重启，激光堵塞提示仍在
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  why: 首卡引用法语清洁和重启原话，明确按同样方法做过可标记未解决；后两张不重复说明。事实承接改善，按卡确认合理。但说明、操作和后续回复仍是英语，因此整案仍需改进。
  next: 保留首卡确认方式，按客户语言输出说明和操作；不能把法语原话被引用等同于整张卡已翻译。
T22:
