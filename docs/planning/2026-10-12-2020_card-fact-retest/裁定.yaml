T1:
  title: 只收到配件，主机没到
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 系统查出两件包裹均签收，提供承运商调查入口，没有把签收当作用户实际收到主机。当前停在客户确认申请；仍可改进为逐箱确认主机与配件，避免泛称这个包裹。
  next: 客户确认后由人工核实箱内物品和承运商交付，不承诺主机已补发。
T2:
  title: 运单显示与收到的箱内物品矛盾
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 系统明确保留后台记载主机与客户称收到配件的冲突，并请核对箱标。订单记录不是实物交付证明；这一步比照着后台直接否定客户更合理。done只表示本轮回复结束。
  next: 收集两箱标签与物品对应关系后交人工核验；当前尚未查明主机去向。
T3:
  title: 客户问何时发货，记录已签收
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 告知实际记录和日期，并以确实未收到为条件提供调查，没有编造发货日期。可先确认是否收到，减少无关售后政策文字。
  next: 等客户核对收货情况，再决定是否提交调查。
T4:
  title: 配送超过承诺时间，客户要求调查
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 承接不满、给出记录并提供调查入口，没有承诺可控制澳邮或保证赔付。
  next: 人工核验客户投诉时间与签收记录；本轮没有真实联系承运商。
T5:
  title: 两件包裹一件到达，一件逾期
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 区分在途和已签收包裹，对截至测试日已过预计日期的包裹提出补发申请，并说明由同事办理。没有把申请等同实际发货。
  next: 客户确认补发对象后进入人工履约。
T6:
  title: 荷兰语问机器人未收到
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  - Agent边界
  why: 物流方向正确，但客户主要用荷兰语，系统回复和确认卡均为英语。邮件签名含英语不等于客户要求改用英语。
  next: 按客户正文语言翻译回复和按钮，保留原始运单数据。
T7:
  title: 追踪号码查不到，但没提供号码
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 先索取订单号或运单号，既没有凭空查单，也没有用工单标签中的信息冒充客户提供的事实。
  next: 等客户提供号码后查单；没有必要调用故障知识库。
T8:
  title: 包裹被退回，客户问何时收到
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 按退回寄件人的记录提供补发申请入口，等待确认且说明人工办理，没有虚构新的到货时间。
  next: 确认后由人工安排补发。
T9:
  title: 主机未发，客户要求先暂停订单
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 同时识别订单变更和物流查询，优先转交暂停请求，再说明主机预售、配件已到。明确暂停或取消要由同事决定，没有承诺已经拦截。
  next: 人工落实暂停或改购意向；不能仅凭系统转交事件认定仓库已停发。
T10:
  title: C10主机未收到，记录已签收
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 给出两条物流记录并提供调查。承运商签收与客户收到目标商品仍需核验，系统未直接承诺再次发货。
  next: 核对C10对应箱件和投递证据。
T11:
  title: S1 Pro加清水失败，报码EB1L
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 按明确错误码依次发出五个官方检查步骤，模拟反馈均未解决后才收购买资料。未把检索成功或步骤发完称为修复成功。
  next: 真实客户完成检查后反馈；仍失败则核验购买资格并人工处理。
T12:
  title: 清水不足后自动切为仅吸尘
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 卡片说明补水重启，并保留无基站楼层下切换吸尘是保护行为这一条件。整段文字较长，可拆成先问楼层和补水结果，但本次没有直接判硬件损坏。
  next: 实际服务中确认基站所在楼层及补水结果，避免把正常保护行为当故障。
T13:
  title: 5116通信错误缺少已确认官方指导
  verdict: 需要改进
  flow: 合理
  tags:
  - 知识资料缺口
  - Agent边界
  - 语言表达
  why: 对没有确认到官方排障的5116转人工是合理边界；不足是荷兰语输入收到英语回复，以及现有资料缺少该错误码指引。不能把没有可靠资料解释成Agent应该自行编步骤。
  next: 由知识维护人员向厂商补齐5116指导；回复改荷兰语，人工审核期间允许补材料。
T14:
  title: 4090墙传感器异常
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 硬件售后方向来自错误码官方指导，照片本身只能看到机器和红灯，不足以诊断墙传感器。系统按码收资格材料，没有继续无依据排障。
  next: 核验购买资料后由售后检查硬件；无需强行调用远程检索。
T15:
  title: EB03基站集尘风道堵塞
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 依次检查尘袋、机内尘盒、基站入口和底部通道，来源明确，未解决后收购买资料。翻转和拆两颗螺丝来自官方步骤，不是模型追加拆机。
  next: 实物操作仍须按官方说明进行；本测试只检查步骤顺序与终点。
T16:
  title: 尘盒和滤网明明装好却仍报码
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 安装检查照发，首卡引用已装好且干净并说明可确认已做步骤，随后检查磁铁。按客户接受的确认方式，这不是不听客户说话；比上轮多一轮确认，但未见错误跳步。
  next: 检查磁铁结果仍异常时收购买材料继续售后。
T17:
  title: 6063便携清洁器放置异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 按错误码检查微动开关、放置情况和电源连接，保留软管与电源线注意事项；没有因为缺SN就阻止基础排障。
  next: 实际检查仍失败后核验资格。
T18:
  title: 新机已撕保护贴，仍提示滚拖堵塞
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  why: 撕掉保护贴不等于确认滚筒无异物，检查滚筒仍合理；系统没有强迫重撕贴纸。但荷兰语诉求对应英语卡片和收资料回复，影响使用。
  next: 保留滚筒检查流程，按荷兰语输出含注意事项的卡片。
T19:
  title: 6011清水不足，需判断是否水箱问题
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 检查水箱后停在明确选项：部件正常仍报码、密封圈破损、尚未检查。未凭测试器一句未解决就断言所有前提满足或硬件已坏。
  next: 等客户选择真实检查结果后再走对应分支；停止属于缺事实，不能算知识不执行。
T20:
  title: 无法定位并回基站，附摆放照片
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  - Agent边界
  why: 先确认机器人与基站是否同一楼层，这个事实不能由一张基站摆放图推出。本轮没有看到错误安全转人工；不足是荷兰语输入仍用英语追问。
  next: 等客户回答楼层关系；同时检查视觉摘要及后续节点，不能把历史误触发算到本轮。
T21:
  title: 已反复清洁和重启，激光堵塞提示仍在
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  why: 首卡引用法语清洁和重启原话，明确按同样方法做过可标记未解决；后两张不重复说明。事实承接改善，按卡确认合理。但说明、操作和后续回复仍是英语，因此整案仍需改进。
  next: 保留首卡确认方式，按客户语言输出说明和操作；不能把法语原话被引用等同于整张卡已翻译。
T22:
  title: 7002轮子离地
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  why: 按错误码保留卡在家具边缘与平地仍报错两种条件，没有把设备告警认作电池危险。问题是荷兰语输入收到英语步骤。
  next: 翻译卡片及售后材料提示，保留原条件。
T23:
  title: E41电池异常，但没有物理危险描述
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 电池异常报码不自动等于鼓包或烫伤。系统按官方码指导升级和重启，未解决才转资格审核；没有错误套用危险停用分支。
  next: 后续如客户补充真实过热或损伤再进入安全处理。
T24:
  title: 6013清水泵异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 发出有来源的基站断电等待10秒再重连步骤，失败后收资格材料，不无限重复排障。
  next: 真实重试仍报错后由售后检查。
T25:
  title: E53视觉传感器异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 清洁指定传感器并重启来自对应错误码指导；未凭没有照片就猜测传感器损坏。
  next: 两项实物检查无效后核验售后资格。
T26:
  title: E23水位异常，需确认是否加过第三方清洁液
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 前两项操作后，把是否用过第三方清洁液作为独立事实问题停下；没有将未解决等价成使用过清洁液。
  next: 等客户回答是、否或不确定，再进入有条件的后续指导。
T27:
  title: 滚拖检查做过，洗拖后仍持续异响
  verdict: 需要改进
  flow: 需改进
  tags:
  - 系统本身要改
  - Agent边界
  why: 本主轮重新要求清理滚拖，却未承接客户已试方案、无堵塞及区域干净，也没有已做步骤的确认说明；上轮该说明存在，因此按同一标准改判需改进。两次独立补测均恢复说明，说明是事实承接不稳定，不能据此断定新代码必然导致退化。
  next: 稳定保留已做检查和持续异响事实；重发卡时说明如何确认，区分安装时咔哒声与洗拖后持续异响。
T28:
  title: 德语滚刷故障通知
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  why: 本次只走2111重启排障和购买材料，没有凭推送通知字段新增物流任务。缺陷仍是德语输入、英语输出。
  next: 本轮不能沿用历史意图误判结论；补测稳定性，并修正语言输出。
T29:
  title: 水盘不排水，客户已完成多项检查
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 首卡引用四项已做检查，说明如何确认重叠步骤，随后依次锁扣、格栅清洁、压盖及密封圈检查。按条件发卡合理；相较上轮失去了只补查格栅的细致说明，但有统一确认解释，不机械扣为重复操作错误。
  next: 保留已做检查引用；后续可优化成更短的确认操作。订单仍按项目记录过保，未安排实际服务。
T30:
  title: 两天前换过边刷，现在E4异常
  verdict: 需要改进
  flow: 合理
  tags:
  - 图片识别问题
  why: 主轮和两次独立补测都把前景机器人写成基站，视觉提示词修改尚未解决主体识别。明确型号和E4仍使排障方向合理；不是整条排障失败。
  next: 修正视觉对象定位，区分主机与背景基站；结合实际缠绕和重启结果继续售后。
T31:
  title: 触点已擦净仍不充电，系统建议恢复出厂
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 首卡承接已擦净触点，恢复出厂卡新增可能删地图、长按红键超过5秒及需要重新建图的提醒。上轮要求的数据影响提示已实际出现，因此本轮转合理；测试未操作设备，也未验证两个资料中的红键是否完全相同。
  next: 保留操作前地图风险提示；由官方核对两份说明中的红键对应关系，避免将跨条目推断写成已验证硬件事实。
T32:
  title: 水仓反复报未安装，官方建议临时贴胶带
  verdict: 需要改进
  flow: 合理
  tags:
  - 官方口径问题
  - 系统本身要改
  why: 系统正确跳过反复重装，但照搬来源中的安排换新之前、成功率较高。资格尚未审核，这些措辞容易让客户以为已承诺换新或成功概率有依据；问题来自源文也需要面客审核。
  next: 官方确认临时方案适用范围与有效性；对客改为可能有帮助，不预先承诺更换。
T33:
  title: E5A陀螺仪异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 按明确错误码先重启再核资格；未增加无来源拆机或重复操作。
  next: 重启实测无效后交售后。
T34:
  title: 维修后地图丢失，历史记录可见却不能用
  verdict: 需要改进
  flow: 合理
  tags:
  - 系统本身要改
  - 知识资料缺口
  why: 找到地图管理与重新建图资料，但只解释重置会删地图，没有回答历史可见为何不能恢复，也没有说明当前无法确认维修时是否重置。客户核心诉求是找回地图，不只是重建。
  next: 承接维修历史，明确历史记录不等于已验证可恢复地图；缺少恢复能力说明时交技术支持核实，不把重建当作原地图已找回。
T35:
  title: 低电回充后续扫
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 将所述行为解释为低电回站、足够电量后继续任务，没有为正常行为制造故障或启动保修申请。
  next: 若实际未续扫，再按新事实排查。
T36:
  title: 换过滤网刷子仍很吵
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  - Agent边界
  why: 主轮先问拆滚刷及其盖后噪声是否消失，属于未知事实，不再出现问题卡却提示未解决的冲突。本轮仍为荷兰语输入、英语输出。三次真实路径没有命中原问题卡，因此卡型说明修正目前由自动化测试支持，不能称真实问答卡3次通过。
  next: 修正回复语言；后续真实命中问题卡时继续核对说明与可选操作。
T37:
  title: 满水箱仍提示加水并停止拖地
  verdict: 需要改进
  flow: 需改进
  tags:
  - 语言表达
  - 系统本身要改
  why: 首卡已经明确引用清水箱仍满、洗拖时加水报警和随后只吸尘，事实引用修复生效。但正文仍称只是普通低水提醒、方便时加水即可，与满水仍停拖的现象不相符；英语输出也未改，因此整案仍需改进。
  next: 保留满水事实引用，针对满水仍报警改写适用说明，避免普通低水解释覆盖异常；同时按客户语言输出。
T38:
  title: 水不足提示持续，附收据
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 首卡承接反复洗拖布，继续检查尚未确认的水箱部件，随后等待密封圈和重装结果的真实选择。未把未解决自动当成部件完好，边界合理。
  next: 等客户反馈密封圈状态与重装结果。
T39:
  title: 只说机器人离线
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 先确认是否发生于固件升级或进度卡住，属于区分适用方案的事实澄清；没有擅自认定家里Wi-Fi有问题。
  next: 等客户补充发生时机后选排障路径。
T40:
  title: S1 Pro清洁液好像不消耗
  verdict: 需要改进
  flow: 需改进
  tags:
  - 知识未执行
  - 知识资料缺口
  - 系统本身要改
  why: 主轮选择了缺链接的rv-0371，明确告知缺资料后问瓶子是否装好；检索同时召回带文章链接的rv-0073，但没有切到完整方案。补测一次正确发安装卡→带官网链接的问题卡，另一次先问安装。文章确认机制确已生效，但资料选择及缺口替代仍不稳定，主轮不改判合理。
  next: 对同型号同症状的完整条目做明确替代，保留文章是否完成的事实问题；不能把所有未出卡都算成知识库没工作。
T41:
  title: 未启动拖地却报烘干失败，还要查配件物流
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 主轮问具体错误码；两次补测问注水故障的错误信息。三次都未再追问是否运行过拖地或烘干，已知否定事实没有重问。设备与配送任务仍保留，但配送仍排队；本轮维持合理，不称物流已解决。
  next: 取得未知错误信息后继续；独立推进配件配送诉求。3次观察支持改善，不等于所有表达均已覆盖。
T42:
  title: 塑料件脱落并漏水
  verdict: 需要改进
  flow: 合理
  tags:
  - 图片识别问题
  - Agent边界
  why: 收购买材料的售后路线仍合理，但本轮视觉把画面主体称为基站；照片前景实际是手持脱落塑料件及机器人底部，基站在背景。上轮摘要明确将基站作为背景，本轮主体判断变差。按与T30相同的视觉标准列为需改进，不能因售后路线没变而漏记识别错误。
  next: 区分前景手持配件、机器人本体与背景基站；继续由人工确认脱落部件及漏水范围。
T43:
  title: 西班牙语说机器人断连
  verdict: 需要改进
  flow: 合理
  tags:
  - 语言表达
  - Agent边界
  why: 追问是Wi-Fi连不上还是其他离线原因，属于有效事实澄清；西班牙语客户仍收到英语，综合仍需改进。
  next: 用西班牙语取得连接现象后继续。
T44:
  title: 充电盒针脚卡住，客户想更换
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 识别明确更换诉求并先核资格，没有继续让客户清洁已干净的触点，也没有擅自下更换订单。
  next: 收购买材料后转人工确认针脚损伤和更换选项。
T45:
  title: 乳泵曾烫伤客户且不能充电
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 烫伤和变色是客户明确报告，系统先提示停止使用和充电并转人工，优先级正确。附件只是购买记录，无需等图片识别完成才处理安全诉求。
  next: 人工接续安全事件及售后调查；本评审不做医疗或责任认定。
T46:
  title: 使用约20次的乳泵电机异响
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 先问持续还是间歇噪声，不把购买凭证当作噪声证据，也没有未经判断就保证换新。
  next: 等真实声音特征或视频，进入对应排查。
T47:
  title: 查单独泵头运单，却只找到整机订单
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 正确指出订单商品与客户所问泵头不同，没有把整机已签收当成泵头已发货。
  next: 索取独立配件订单或服务案件号后继续查询。
T48:
  title: 照片里的绿灯是什么，外壳还可见裂纹
  verdict: 需要改进
  flow: 需改进
  tags:
  - 知识资料缺口
  - 图片结果未用
  - 图片识别问题
  - 系统本身要改
  why: 本轮不再猜成耳机盒，视觉记录为白色小家电主机，识别到绿灯、黄灯及按键；但漏掉照片可见裂纹。补乳泵型号后仍仅答资料没有绿灯含义并列红灯规则，缺少有效下一步。相比上轮有局部改善，综合仍需改进。
  next: 将灯的位置、颜色和可见裂纹交给回答阶段；补齐型号灯态资料，资料不足时明确转人工核实，不猜灯义。
T49:
  title: 保险部分支付的乳泵不能开机，希望换新
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 优先收购买凭证，保留后续排障任务；保险支付本身不证明或否定厂家保修资格。
  next: 核实卖方、日期与国家，由人工处理更换；本轮不代表已接受申请。
T50:
  title: 客户只说左边能工作
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 保留肯定词能工作，追问究竟哪侧哪部件出问题，没有擅自把does work改成does not work。
  next: 等客户明确故障侧和症状。
T51:
  title: 充过电仍用着用着关机
  verdict: 需要改进
  flow: 合理
  tags:
  - 官方口径问题
  why: 本轮五张操作卡，第一张直接确保充满电；检查电量小标题已合并，不再单独占卡。两项已知流程缺陷均未出现，但speaker cover译作扬声器罩是否适用于乳泵、蓝牙检查与断电关联仍需官方核对，所以综合仍需改进。
  next: 保留充满电步骤及标题合并；官方核实部件名称、蓝牙适用条件。不要为了提高合理数忽略尚未解决的源文问题。
T52:
  title: 充电盒自身充不进电
  verdict: 需要改进
  flow: 需改进
  tags:
  - 系统本身要改
  - 意图或症状理解
  - 知识适用错误
  why: 客户明确说充电盒自身充不进电，本主轮却选择盒内给泵充电的方案，先摆放泵、清磁吸头、复位泵，随后收售后材料，故障对象跑偏。两次独立补测均正确问盒本身接电后的灯态，说明路径存在波动；补测不能覆盖主轮错误。
  next: 将“盒自身不能充电”和“盒不能给泵充电”作为不同症状，选知识前核对故障对象。
T53:
  title: 客户称保内已坏，但过保后才申请
  verdict: 口径待核
  flow: 待核
  tags:
  - 官方口径问题
  - 系统本身要改
  - Agent边界
  why: 订单过保判断仍先于保内首次故障争议处理，本轮改走bp-0114，最后等待“按钮是否到货即坏”的答案，没有直接结束。缺少保内故障、过保申报的例外口径，仍待官方或人工判定，不能据排障继续就算争议解决。
  next: 保留客户原话、购买凭证和日期差异，交人工按官方例外政策判断；补齐口径再自动化。
T54:
  title: 乳泵完全没有吸力
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 覆盖破损、装配密封、佩戴与尺寸、舒适吸力、复位和主机吸力检查，未解决后收资格材料。没有以发完七张卡作为设备已修好。
  next: 实际反馈需保留主机是否有吸力，必要时定位配件或主机问题。
T55:
  title: 左泵咔哒响不吸，已有收据
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 首卡引用隔膜检查和手洗配件，后续检查主机吸力与阀片密封，未把隔膜坐好当作全部正常。最终沿用已有订单，只补故障影像和SN，合理。
  next: 客户补齐故障影像与序列号后提交更换审核。
T56:
  title: 摄像头离线，客户情绪很差
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 本轮先承接不满，问摄像头电量是否过低，属于尚未知的有效区分事实；没有持续发卡或宣称解决。与上轮两步操作后让客户选择人工不同，本轮还未走到服务偏好选择。
  next: 等电量状态后选择对应指导，并在继续服务时保留人工选项。
T57:
  title: 多台摄像头不工作且不录像
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 本轮承接不满，问故障摄像头是否有灯、按同步键是否响应，有助于区分设备供电与连接问题；Wi-Fi正常不等于摄像头自身正常，当前澄清合理。
  next: 继续时需保留多台同时异常和不录像，确认型号、基站与App状态，避免逐台重复无效检查。
T58:
  title: 只有抱怨，没有故障现象
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 不与辱骂争辩，索取具体表现并提供人工选项。没有为了展示知识强行启动排障。
  next: 等客户描述问题或选择人工。
T59:
  title: 希望把两台S340换成C20
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 识别跨型号更换意向，先核资格，没有承诺可以按客户指定型号免费替换。
  next: 人工审核跨型号方案和数量；保修有效也不自动等于可换任意型号。
T60:
  title: App很难用，只想机器人能清扫
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 本轮选型号后仍先问设备具体表现、App警告或错误码，未把“只想正常清扫”当成清洁效果差。主轮和两次独立补测共3次表现一致，愿望与具体症状的区分有实测改善。
  next: 取得真实症状后再排障；本轮不等于App易用性问题或设备故障已解决。
T61:
  title: 提前两小时启动，清扫还不留记录
  verdict: 需要改进
  flow: 需改进
  tags:
  - 系统本身要改
  - 知识未执行
  why: 本轮已带上“提前两小时”，比上轮只说“之前发生过”更具体，但仍重复确认客户已说的现象，并仅问App警告；清扫记录缺失没有独立推进。事实承接和多症状覆盖仍需改进。
  next: 保留提前两小时及记录缺失，核对实际设定时间与显示时间等区分信息；不直接认定时区原因，也不套用根本不启动的方案。
T62:
  title: C20不走直线
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 先问是否反复清扫同一区域或路径重叠，能区分轨迹异常类型；没有未经描述就建议换件，边界合理。
  next: 等客户描述路径或提供视频后判断。
T63:
  title: 滚刷护盖卡扣断裂，买不到配件
  verdict: 处理合理
  flow: 合理
  tags:
  - Agent边界
  why: 识别配件购买与清扫问题，明确没有库存查询和配件下单能力，将护盖诉求交人工。物理卡扣损坏不应继续靠清洁排障掩盖。
  next: 人工核实准确型号、护盖件号与库存；自动转交不代表采购已完成，后续需保留清扫和防缠绕异常。
