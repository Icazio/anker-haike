T27:
  verdict: 需要改进
  flow: 需改进
  tags: [系统本身要改, Agent边界]
  why: '本主轮重新要求清理滚拖，却未承接客户已试方案、无堵塞及区域干净，也没有已做步骤的确认说明；上轮该说明存在，因此按同一标准改判需改进。两次独立补测均恢复说明，说明是事实承接不稳定，不能据此断定新代码必然导致退化。'
  next: '稳定保留已做检查和持续异响事实；重发卡时说明如何确认，区分安装时咔哒声与洗拖后持续异响。'
T30:
  why: '主轮和两次独立补测都把前景机器人写成基站，视觉提示词修改尚未解决主体识别。明确型号和E4仍使排障方向合理；不是整条排障失败。'
T31:
  verdict: 处理合理
  flow: 合理
  tags: []
  why: '首卡承接已擦净触点，恢复出厂卡新增可能删地图、长按红键超过5秒及需要重新建图的提醒。上轮要求的数据影响提示已实际出现，因此本轮转合理；测试未操作设备，也未验证两个资料中的红键是否完全相同。'
  next: '保留操作前地图风险提示；由官方核对两份说明中的红键对应关系，避免将跨条目推断写成已验证硬件事实。'
T36:
  flow: 合理
  tags: [语言表达, Agent边界]
  why: '主轮先问拆滚刷及其盖后噪声是否消失，属于未知事实，不再出现问题卡却提示未解决的冲突。本轮仍为荷兰语输入、英语输出。三次真实路径没有命中原问题卡，因此卡型说明修正目前由自动化测试支持，不能称真实问答卡3次通过。'
  next: '修正回复语言；后续真实命中问题卡时继续核对说明与可选操作。'
T37:
  why: '首卡已经明确引用清水箱仍满、洗拖时加水报警和随后只吸尘，事实引用修复生效。但正文仍称只是普通低水提醒、方便时加水即可，与满水仍停拖的现象不相符；英语输出也未改，因此整案仍需改进。'
  next: '保留满水事实引用，针对满水仍报警改写适用说明，避免普通低水解释覆盖异常；同时按客户语言输出。'
T40:
  flow: 需改进
  tags: [知识未执行, 知识资料缺口, 系统本身要改]
  why: '主轮选择了缺链接的rv-0371，明确告知缺资料后问瓶子是否装好；检索同时召回带文章链接的rv-0073，但没有切到完整方案。补测一次正确发安装卡→带官网链接的问题卡，另一次先问安装。文章确认机制确已生效，但资料选择及缺口替代仍不稳定，主轮不改判合理。'
  next: '对同型号同症状的完整条目做明确替代，保留文章是否完成的事实问题；不能把所有未出卡都算成知识库没工作。'
T41:
  why: '主轮问具体错误码；两次补测问注水故障的错误信息。三次都未再追问是否运行过拖地或烘干，已知否定事实没有重问。设备与配送任务仍保留，但配送仍排队；本轮维持合理，不称物流已解决。'
  next: '取得未知错误信息后继续；独立推进配件配送诉求。3次观察支持改善，不等于所有表达均已覆盖。'
T42:
  verdict: 需要改进
  flow: 合理
  tags: [图片识别问题, Agent边界]
  why: '收购买材料的售后路线仍合理，但本轮视觉把画面主体称为基站；照片前景实际是手持脱落塑料件及机器人底部，基站在背景。上轮摘要明确将基站作为背景，本轮主体判断变差。按与T30相同的视觉标准列为需改进，不能因售后路线没变而漏记识别错误。'
  next: '区分前景手持配件、机器人本体与背景基站；继续由人工确认脱落部件及漏水范围。'
T48:
  why: '本轮不再猜成耳机盒，视觉记录为白色小家电主机，识别到绿灯、黄灯及按键；但漏掉照片可见裂纹。补乳泵型号后仍仅答资料没有绿灯含义并列红灯规则，缺少有效下一步。相比上轮有局部改善，综合仍需改进。'
  next: '将灯的位置、颜色和可见裂纹交给回答阶段；补齐型号灯态资料，资料不足时明确转人工核实，不猜灯义。'
T51:
  tags: [官方口径问题]
  why: '本轮五张操作卡，第一张直接确保充满电；检查电量小标题已合并，不再单独占卡。两项已知流程缺陷均未出现，但speaker cover译作扬声器罩是否适用于乳泵、蓝牙检查与断电关联仍需官方核对，所以综合仍需改进。'
  next: '保留充满电步骤及标题合并；官方核实部件名称、蓝牙适用条件。不要为了提高合理数忽略尚未解决的源文问题。'
T52:
  verdict: 需要改进
  flow: 需改进
  tags: [系统本身要改, 意图或症状理解, 知识适用错误]
  why: '客户明确说充电盒自身充不进电，本主轮却选择盒内给泵充电的方案，先摆放泵、清磁吸头、复位泵，随后收售后材料，故障对象跑偏。两次独立补测均正确问盒本身接电后的灯态，说明路径存在波动；补测不能覆盖主轮错误。'
  next: '将“盒自身不能充电”和“盒不能给泵充电”作为不同症状，选知识前核对故障对象。'
T56:
