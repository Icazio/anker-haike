T1:
  title: 只收到配件，主机没到
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 系统查出两件包裹均签收，提供承运商调查入口，没有把签收当作用户实际收到主机。当前停在客户确认申请；仍可改进为逐箱确认主机与配件，避免泛称这个包裹。
  next: 客户确认后由人工核实箱内物品和承运商交付，不承诺主机已补发。
T2:
  title: 运单显示与收到的箱内物品矛盾
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 系统明确保留后台记载主机与客户称收到配件的冲突，并请核对箱标。订单记录不是实物交付证明；这一步比照着后台直接否定客户更合理。done只表示本轮回复结束。
  next: 收集两箱标签与物品对应关系后交人工核验；当前尚未查明主机去向。
T3:
  title: 客户问何时发货，记录已签收
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 告知实际记录和日期，并以确实未收到为条件提供调查，没有编造发货日期。可先确认是否收到，减少无关售后政策文字。
  next: 等客户核对收货情况，再决定是否提交调查。
T4:
  title: 配送超过承诺时间，客户要求调查
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 承接不满、给出记录并提供调查入口，没有承诺可控制澳邮或保证赔付。
  next: 人工核验客户投诉时间与签收记录；本轮没有真实联系承运商。
T5:
  title: 两件包裹一件到达，一件逾期
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 区分在途和已签收包裹，对截至测试日已过预计日期的包裹提出补发申请，并说明由同事办理。没有把申请等同实际发货。
  next: 客户确认补发对象后进入人工履约。
T6:
  title: 荷兰语问机器人未收到
  verdict: 需要改进
  flow: 合理
  tags: [语言表达, Agent边界]
  why: 物流方向正确，但客户主要用荷兰语，系统回复和确认卡均为英语。邮件签名含英语不等于客户要求改用英语。
  next: 按客户正文语言翻译回复和按钮，保留原始运单数据。
T7:
  title: 追踪号码查不到，但没提供号码
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 先索取订单号或运单号，既没有凭空查单，也没有用工单标签中的信息冒充客户提供的事实。
  next: 等客户提供号码后查单；没有必要调用故障知识库。
T8:
  title: 包裹被退回，客户问何时收到
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 按退回寄件人的记录提供补发申请入口，等待确认且说明人工办理，没有虚构新的到货时间。
  next: 确认后由人工安排补发。
T9:
  title: 主机未发，客户要求先暂停订单
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 同时识别订单变更和物流查询，优先转交暂停请求，再说明主机预售、配件已到。明确暂停或取消要由同事决定，没有承诺已经拦截。
  next: 人工落实暂停或改购意向；不能仅凭系统转交事件认定仓库已停发。
T10:
  title: C10主机未收到，记录已签收
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 给出两条物流记录并提供调查。承运商签收与客户收到目标商品仍需核验，系统未直接承诺再次发货。
  next: 核对C10对应箱件和投递证据。
T11:
  title: S1 Pro加清水失败，报码EB1L
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 按明确错误码依次发出五个官方检查步骤，模拟反馈均未解决后才收购买资料。未把检索成功或步骤发完称为修复成功。
  next: 真实客户完成检查后反馈；仍失败则核验购买资格并人工处理。
T12:
  title: 清水不足后自动切为仅吸尘
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 卡片说明补水重启，并保留无基站楼层下切换吸尘是保护行为这一条件。整段文字较长，可拆成先问楼层和补水结果，但本次没有直接判硬件损坏。
  next: 实际服务中确认基站所在楼层及补水结果，避免把正常保护行为当故障。
T13:
  title: 5116通信错误缺少已确认官方指导
  verdict: 需要改进
  flow: 合理
  tags: [知识资料缺口, Agent边界, 语言表达]
  why: 对没有确认到官方排障的5116转人工是合理边界；不足是荷兰语输入收到英语回复，以及现有资料缺少该错误码指引。不能把没有可靠资料解释成Agent应该自行编步骤。
  next: 由知识维护人员向厂商补齐5116指导；回复改荷兰语，人工审核期间允许补材料。
T14:
  title: 4090墙传感器异常
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 硬件售后方向来自错误码官方指导，照片本身只能看到机器和红灯，不足以诊断墙传感器。系统按码收资格材料，没有继续无依据排障。
  next: 核验购买资料后由售后检查硬件；无需强行调用远程检索。
T15:
  title: EB03基站集尘风道堵塞
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 依次检查尘袋、机内尘盒、基站入口和底部通道，来源明确，未解决后收购买资料。翻转和拆两颗螺丝来自官方步骤，不是模型追加拆机。
  next: 实物操作仍须按官方说明进行；本测试只检查步骤顺序与终点。
T16:
  title: 尘盒和滤网明明装好却仍报码
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 正确承接已完全装好且清洁的描述，跳过重复安装检查，进入滤网磁铁检查。跳过依据与目标步骤匹配。
  next: 检查磁铁结果仍异常时收购买材料继续售后。
T17:
  title: 6063便携清洁器放置异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 按错误码检查微动开关、放置情况和电源连接，保留软管与电源线注意事项；没有因为缺SN就阻止基础排障。
  next: 实际检查仍失败后核验资格。
T18:
  title: 新机已撕保护贴，仍提示滚拖堵塞
  verdict: 需要改进
  flow: 合理
  tags: [语言表达]
  why: 撕掉保护贴不等于确认滚筒无异物，检查滚筒仍合理；系统没有强迫重撕贴纸。但荷兰语诉求对应英语卡片和收资料回复，影响使用。
  next: 保留滚筒检查流程，按荷兰语输出含注意事项的卡片。
T19:
  title: 6011清水不足，需判断是否水箱问题
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 检查水箱后停在明确选项：部件正常仍报码、密封圈破损、尚未检查。未凭测试器一句未解决就断言所有前提满足或硬件已坏。
  next: 等客户选择真实检查结果后再走对应分支；停止属于缺事实，不能算知识不执行。
T20:
  title: 无法定位并回基站，附摆放照片
  verdict: 需要改进
  flow: 合理
  tags: [语言表达, Agent边界]
  why: 先确认机器人与基站是否同一楼层，这个事实不能由一张基站摆放图推出。本轮没有看到错误安全转人工；不足是荷兰语输入仍用英语追问。
  next: 等客户回答楼层关系；同时检查视觉摘要及后续节点，不能把历史误触发算到本轮。
T21:
  title: 已反复清洁和重启，激光堵塞提示仍在
  verdict: 需要改进
  flow: 需改进
  tags: [系统本身要改, 语言表达]
  why: 针对雷达罩内毛发和转动情况补查可以有价值，但系统没有承接客户已经多次清洁、重启，又完整发出清洁与重启卡。更具体的检查应解释差异；法语客户还收到全英语回复。
  next: 先记住已做动作，只补查未确认的部位或条件；若确须重试，说明与上次不同的理由。
T22:
  title: 7002轮子离地
  verdict: 需要改进
  flow: 合理
  tags: [语言表达]
  why: 按错误码保留卡在家具边缘与平地仍报错两种条件，没有把设备告警认作电池危险。问题是荷兰语输入收到英语步骤。
  next: 翻译卡片及售后材料提示，保留原条件。
T23:
  title: E41电池异常，但没有物理危险描述
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 电池异常报码不自动等于鼓包或烫伤。系统按官方码指导升级和重启，未解决才转资格审核；没有错误套用危险停用分支。
  next: 后续如客户补充真实过热或损伤再进入安全处理。
T24:
  title: 6013清水泵异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 发出有来源的基站断电等待10秒再重连步骤，失败后收资格材料，不无限重复排障。
  next: 真实重试仍报错后由售后检查。
T25:
  title: E53视觉传感器异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 清洁指定传感器并重启来自对应错误码指导；未凭没有照片就猜测传感器损坏。
  next: 两项实物检查无效后核验售后资格。
T26:
  title: E23水位异常，需确认是否加过第三方清洁液
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 前两项操作后，把是否用过第三方清洁液作为独立事实问题停下；没有将未解决等价成使用过清洁液。
  next: 等客户回答是、否或不确定，再进入有条件的后续指导。
T27:
  title: 滚拖检查做过，洗拖后仍持续异响
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 承接已检查无堵塞，未要求重复清理，也没有把持续咔裂声解释为安装时正常卡扣声。现有已确认步骤耗尽后收售后材料合理。
  next: 人工接手时保留洗拖之后持续响和无法启动两个事实，并索取该时段视频帮助定位。
T28:
  title: 德语滚刷故障通知
  verdict: 需要改进
  flow: 合理
  tags: [语言表达]
  why: 本次只走2111重启排障和购买材料，没有凭推送通知字段新增物流任务。缺陷仍是德语输入、英语输出。
  next: 本轮不能沿用历史意图误判结论；补测稳定性，并修正语言输出。
T29:
  title: 水盘不排水，客户已完成多项检查
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 首张就是锁扣检查卡，清洁卡明确承接已清洁并只补查格栅。压盖抽水和密封圈修正保留条件；最后依当前日期告知订单已过保，没有把转售后等同必定免费换新。
  next: 可进一步细化实际压盖结果；本次观察已修复自由文本先追问锁扣的问题。
T30:
  title: 两天前换过边刷，现在E4异常
  verdict: 需要改进
  flow: 合理
  tags: [图片识别问题]
  why: 排障方向合理，换过边刷不等于现时无缠绕；但视觉摘要把前景机器人称为扫地机器人基站，识别对象不准。明确型号与E4码使本次路线未受影响，不能把描述错误夸大成整条排障错误。
  next: 修正视觉对象定位，区分主机与背景基站；结合实际缠绕和重启结果继续售后。
T31:
  title: 触点已擦净仍不充电，系统建议恢复出厂
  verdict: 需要改进
  flow: 合理
  tags: [系统本身要改]
  why: 已清洁触点被正确跳过，但恢复出厂步骤没有提示会影响已保存配置或地图。项目另有S1 Pro地图知识说明长按红键会删除地图，直接让客户执行缺少关键后果提示。
  next: 在恢复出厂卡上按该型号官方说明展示数据影响及必要确认。属于对客完整性问题，不把本次模拟反馈当作真丢图。
T32:
  title: 水仓反复报未安装，官方建议临时贴胶带
  verdict: 需要改进
  flow: 合理
  tags: [官方口径问题, 系统本身要改]
  why: 系统正确跳过反复重装，但照搬来源中的安排换新之前、成功率较高。资格尚未审核，这些措辞容易让客户以为已承诺换新或成功概率有依据；问题来自源文也需要面客审核。
  next: 官方确认临时方案适用范围与有效性；对客改为可能有帮助，不预先承诺更换。
T33:
  title: E5A陀螺仪异常
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 按明确错误码先重启再核资格；未增加无来源拆机或重复操作。
  next: 重启实测无效后交售后。
T34:
  title: 维修后地图丢失，历史记录可见却不能用
  verdict: 需要改进
  flow: 合理
  tags: [系统本身要改, 知识资料缺口]
  why: 找到地图管理与重新建图资料，但只解释重置会删地图，没有回答历史可见为何不能恢复，也没有说明当前无法确认维修时是否重置。客户核心诉求是找回地图，不只是重建。
  next: 承接维修历史，明确历史记录不等于已验证可恢复地图；缺少恢复能力说明时交技术支持核实，不把重建当作原地图已找回。
T35:
  title: 低电回充后续扫
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 将所述行为解释为低电回站、足够电量后继续任务，没有为正常行为制造故障或启动保修申请。
  next: 若实际未续扫，再按新事实排查。
T36:
  title: 换过滤网刷子仍很吵
  verdict: 需要改进
  flow: 合理
  tags: [语言表达, Agent边界]
  why: 更换零件不等于做过移除滚刷与罩后的噪声对比，追问这一差异有意义；系统没有认定电机已坏。荷兰语客户收到英语追问。远程链接未作为本地视频上传，不能称已听到噪声。
  next: 用荷兰语解释为何需要隔离检查；没有客户结果就不虚构原因。
T37:
  title: 满水箱仍提示加水并停止拖地
  verdict: 需要改进
  flow: 合理
  tags: [语言表达]
  why: 承接水箱已满，不再要求重复补水，也没有拿App显示误差解释实际停止拖地。当前转资格审核合理；缺陷是荷兰语用户收到英语长回复。
  next: 翻译回复并保留管路和胶圈正常的原话，供人工继续排查。
T38:
  title: 水不足提示持续，附收据
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 反复洗拖布并不证明密封圈和装配已查正常，因此继续水箱检查并停在事实选择题合理。购买凭证不能替代故障检查结果。
  next: 等客户反馈密封圈状态与重装结果。
T39:
  title: 只说机器人离线
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 先确认是否发生于固件升级或进度卡住，属于区分适用方案的事实澄清；没有擅自认定家里Wi-Fi有问题。
  next: 等客户补充发生时机后选排障路径。
T40:
  title: S1 Pro清洁液好像不消耗
  verdict: 需要改进
  flow: 合理
  tags: [知识未执行, 系统本身要改]
  why: 本次能选中相关资料并附完整官网链接，执行方向合理。问题是链接内的液位观察条件没有进入可追溯的对话，只靠统一未解决反馈就称官方排障完成。测试不能据此证明客户没有读链接，这是知识展开和完成依据不够清楚，不是已证实完全没用知识。
  next: 把链接内关键测量步骤和条件转成可反馈卡片；至少确认是否完成链接内检查，再称整套排障已完成。
T41:
  title: 未启动拖地却报烘干失败，还要查配件物流
  verdict: 需要改进
  flow: 需改进
  tags: [系统本身要改, 知识未执行]
  why: 已识别排障与物流两个诉求，但又问错误是否发生在烘干周期，忽略客户明确没运行拖地和烘干。排障追问还挡住了可独立索取单号的配件物流事项。
  next: 沿用没有烘干的前提核对异常通知，单独推进配件查询；不能为了套用候选知识而重问已知事实。
T42:
  title: 塑料件脱落并漏水
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 文字与照片共同支持明确物损，收资格材料比继续清洁重启更合理。没有仅凭照片猜配件编号或保证免费更换。
  next: 人工核部件、损坏范围和服务资格。
T43:
  title: 西班牙语说机器人断连
  verdict: 需要改进
  flow: 合理
  tags: [语言表达, Agent边界]
  why: 确认是否无法连家中Wi-Fi有助于区分离线含义，没有硬套升级失败。缺陷是西班牙语输入、英语追问。
  next: 用西班牙语取得连接现象后继续。
T44:
  title: 充电盒针脚卡住，客户想更换
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 识别明确更换诉求并先核资格，没有继续让客户清洁已干净的触点，也没有擅自下更换订单。
  next: 收购买材料后转人工确认针脚损伤和更换选项。
T45:
  title: 乳泵曾烫伤客户且不能充电
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 烫伤和变色是客户明确报告，系统先提示停止使用和充电并转人工，优先级正确。附件只是购买记录，无需等图片识别完成才处理安全诉求。
  next: 人工接续安全事件及售后调查；本评审不做医疗或责任认定。
T46:
  title: 使用约20次的乳泵电机异响
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 先问持续还是间歇噪声，不把购买凭证当作噪声证据，也没有未经判断就保证换新。
  next: 等真实声音特征或视频，进入对应排查。
T47:
  title: 查单独泵头运单，却只找到整机订单
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 正确指出订单商品与客户所问泵头不同，没有把整机已签收当成泵头已发货。
  next: 索取独立配件订单或服务案件号后继续查询。
T48:
  title: 照片里的绿灯是什么，外壳还可见裂纹
  verdict: 需要改进
  flow: 需改进
  tags: [知识资料缺口, 图片结果未用, 系统本身要改]
  why: 视觉本轮已明确识别绿灯、黄灯和外壳裂纹，因此不能再记为没读图或漏检裂纹。问题是最终回答没用这些观察，补型号后仍只说不知道绿灯并列红灯说明，缺少灯位置、闪烁状态追问或明确转接。
  next: 将灯位置和裂纹观察传给回答阶段，补型号对应官方灯态图表；不能把绿色一概说成正常或故障。
T49:
  title: 保险部分支付的乳泵不能开机，希望换新
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 优先收购买凭证，保留后续排障任务；保险支付本身不证明或否定厂家保修资格。
  next: 核实卖方、日期与国家，由人工处理更换；本轮不代表已接受申请。
T50:
  title: 客户只说左边能工作
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 保留肯定词能工作，追问究竟哪侧哪部件出问题，没有擅自把does work改成does not work。
  next: 等客户明确故障侧和症状。
T51:
  title: 充过电仍用着用着关机
  verdict: 需要改进
  flow: 合理
  tags: [官方口径问题, 系统本身要改]
  why: 本轮没有把充过电当成充满，保留了充满步骤，这是改善。但官方条目被切出只有检查电量四字的空泛操作卡，后续还有speaker cover和蓝牙检查，术语及与关机的关联需厂商核实。
  next: 把标题与操作合并，要求可回答的电量观察；官方确认部件名称与蓝牙步骤。补测第二次再次把充过电当成充满并跳s6，说明事实承接仍不稳定，补测缺陷单列不覆盖主轮。
T52:
  title: 充电盒自身充不进电
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 追问盒本身接电后的指示状态，保留故障对象。没有误当成泵与盒接触不良而直接让她摆放泵头。
  next: 根据盒自身灯态选择指导，不能混用泵充满与盒充满的灯态。
T53:
  title: 客户称保内已坏，但过保后才申请
  verdict: 口径待核
  flow: 待核
  tags: [官方口径问题, 系统本身要改, Agent边界]
  why: 订单过保可以确认，但首次故障在保内、为何延迟申报的争议没有处理，系统直接拒绝免费服务并最终关闭。现有材料不足以判定是否有例外资格；不能断言客户一定有权换新，也不能把普通到期规则视作争议已解决。
  next: 保留客户原话、购买凭证和日期差异，交人工按官方例外政策判断；补齐口径再自动化。
T54:
  title: 乳泵完全没有吸力
  verdict: 处理合理
  flow: 合理
  tags: []
  why: 覆盖破损、装配密封、佩戴与尺寸、舒适吸力、复位和主机吸力检查，未解决后收资格材料。没有以发完七张卡作为设备已修好。
  next: 实际反馈需保留主机是否有吸力，必要时定位配件或主机问题。
T55:
  title: 左泵咔哒响不吸，已有收据
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 隔膜坐好不等于阀片无破损且全部密封，继续检查这些差异合理。末轮用已有订单确认保内，只补故障影像与SN，没有重复索收据或声称已换新。
  next: 客户补齐故障影像与序列号后提交更换审核。
T56:
  title: 摄像头离线，客户情绪很差
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 承接不满并做两步基础检查后，提供继续或人工的选择，没有无休止发卡；停点是客户偏好未知，不算知识库失效。
  next: 等客户选择人工或继续；本轮未替客户决定。
T57:
  title: 多台摄像头不工作且不录像
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 客户说Wi-Fi正常不等于每台摄像头供电与连接状态正常。先问SYNC后LED状态能区分完全无电与系统离线，不直接接受或否定系统被改坏的猜测。
  next: 继续时需保留多台同时异常和不录像，确认型号、基站与App状态，避免逐台重复无效检查。
T58:
  title: 只有抱怨，没有故障现象
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 不与辱骂争辩，索取具体表现并提供人工选项。没有为了展示知识强行启动排障。
  next: 等客户描述问题或选择人工。
T59:
  title: 希望把两台S340换成C20
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 识别跨型号更换意向，先核资格，没有承诺可以按客户指定型号免费替换。
  next: 人工审核跨型号方案和数量；保修有效也不自动等于可换任意型号。
T60:
  title: App很难用，只想机器人能清扫
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 先确认型号再索具体症状，未从情绪化抱怨推断错误码。型号补充来自官方独立产品列，报告明确标为测试补充。
  next: 客户提供现象后再排障；当前没有足够事实执行方案。
T61:
  title: 提前两小时启动，清扫还不留记录
  verdict: 需要改进
  flow: 需改进
  tags: [系统本身要改, 知识未执行]
  why: 系统复述提前启动再问是不是这样，未承接已明确两小时偏差；对没有清扫记录也未单独回应。询问告警可以补充事实，但不应重复确认而漏掉第二个症状。
  next: 保留提前两小时及记录缺失，核对实际设定时间与显示时间等区分信息；不直接认定时区原因，也不套用根本不启动的方案。
T62:
  title: C20不走直线
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 先区分不直走是否为重复覆盖同一区域，有助于防止把正常转向与异常绕圈混为一谈；没有凭一条抱怨建议换件。
  next: 等客户描述路径或提供视频后判断。
T63:
  title: 滚刷护盖卡扣断裂，买不到配件
  verdict: 处理合理
  flow: 合理
  tags: [Agent边界]
  why: 识别配件购买与清扫问题，明确没有库存查询和配件下单能力，将护盖诉求交人工。物理卡扣损坏不应继续靠清洁排障掩盖。
  next: 人工核实准确型号、护盖件号与库存；自动转交不代表采购已完成，后续需保留清扫和防缠绕异常。
