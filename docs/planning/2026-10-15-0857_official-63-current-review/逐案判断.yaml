T1:
  verdict: 当前可走到必要确认
  category: [Agent权限边界, 物流记录与实收冲突]
  judgment: 物流签收不等于客户实际拿到主机。对照组没有声称客户一定收到了，而是提出承运商调查；不能凭对话直接承诺补发。
  next: 客户确认后由有权限人员核实包裹、签收与商品。此次没有点击申请确认，因此未验证后续执行。
T2:
  verdict: 当前处理合理
  category: [物流记录与实收冲突]
  judgment: 系统保留了“记录是主机、客户说是配件”的矛盾，没有用数据库覆盖客户陈述。追问实际包裹内容有必要。结束当前回答不代表纠纷解决。
  next: 核实包裹标签、实物与运单对应关系，再决定查件或售后。
T3:
  verdict: 对照组可继续，默认配置阻塞
  category: [系统运行, Agent权限边界]
  judgment: 默认配置未理解发货查询。对照组能查询到已送达记录并给出调查入口。测试订单是固定样本，不能拿其送达日期证明真实客户记错。
  next: 先恢复默认理解链路，再验证调查申请的确认与实际处理。
T4:
  verdict: 主要路径合理，表述可改
  category: [官方口径, 物流记录与实收冲突]
  judgment: 承诺1—3工作日、客户称9月14日购买、系统称9月12日购买，三件事需分别说明。对照组给出了查询依据和调查入口，但没有解释配送承诺为何落空；多查购买日期也没有解决核心抱怨。
  next: 官方明确配送时效、承运商调查和补偿口径；回复直接解释待核查的时间差。
T5:
  verdict: 当前可走到必要确认
  category: [Agent权限边界, 官方口径]
  judgment: 区分了仍在途的主机和已送达的配件。按测试当天10月15日，9月30日预计送达已过期，提出补发申请与当前测试政策一致；申请不是补发完成。
  next: 确认后由业务人员处理，另行验证真实订单接口和实际履约。
T6:
  verdict: 业务路径合理，语言不匹配
  category: [回复语言, Agent权限边界]
  judgment: 荷兰语诉求被理解为未收到货，调查路径合理，但答复切成了英语。默认组偶尔返回英语不能当作完整多语言能力。
  next: 保留客户语言；继续前需客户确认调查申请。
T7:
  verdict: 当前追问必要
  category: [信息不足]
  judgment: 客户没有提供可查的订单号或运单号，系统要求补充标识是必要动作，不能算意图失败。
  next: 客户提供标识后查询；不要编造到货时间。
T8:
  verdict: 当前可走到必要确认
  category: [Agent权限边界]
  judgment: 已退回寄件人与仍在运输不同。按当前测试政策给补发申请合理，未越权声称已经重发。
  next: 收集客户确认，再验证业务处理。
T9:
  verdict: 对照组保留两项请求
  category: [多请求处理, Agent权限边界]
  judgment: 对照组既登记暂停订单，也查到主机未发、滤网已送达；没有把“已交同事”写成“已暂停”。默认组只处理暂停请求，漏了配送查询。
  next: 官方人员确认是否仍能暂停；系统保留已登记但尚未完成的订单操作。
T10:
  verdict: 当前可走到必要确认
  category: [Agent权限边界]
  judgment: 按商品与包裹分别报告，提出签收争议调查，没有把另一个产品的送达当作C10送达。
  next: 客户确认调查，核实实收。
T11:
  verdict: 已验证排障流程推进
  category: [知识已执行, 售后材料待补]
  judgment: 错误码对应的检查按顺序输出，五次模拟未解决后转入售后材料收集，没有宣布修好。固件版本门槛属于资料内容，真实设备是否满足未验证。
  next: 客户提供真实结果和订单；不能把模拟反馈当作现场检查。
T12:
  verdict: 已验证排障流程推进
  category: [知识已执行, 售后材料待补]
  judgment: 缺水与切换仅吸尘的因果关系保持正确。先补水重启，再按未解决转售后，流程合理。
  next: 核实真实水位和执行结果，再继续售后。
T13:
  verdict: 暂未找到可执行指引
  category: [知识覆盖待补, Agent能力边界, 回复语言]
  judgment: 没有把相近通信错误码冒充5116。转人工比套用其他型号或错误码稳妥；这不等于证明整个官方知识体系都没有该条目。
  next: 知识负责人补充E25错误5116的适用流程；保留荷兰语答复。
T14:
  verdict: 当前售后分流合理
  category: [图片识别合理, Agent能力边界]
  judgment: 图中机器人和基站、红色灯条识别基本符合附件。硬件售后结论主要来自4090代码对应资料，而非仅凭红灯诊断。
  next: 核对订单及硬件售后资格，不能由照片承诺免费更换。
T15:
  verdict: 步骤有依据，官方操作说明需补全
  category: [官方口径, 操作前提]
  judgment: 翻基站、拆两颗螺丝来自rv-0428，不能归咎于Agent凭空编造。但卡片和源条目均没交代断电、积水处理等准备条件，对用户执行不够完整。
  next: 官方确认可由用户操作的范围及准备事项；系统展示完整前提后再给操作卡。
T16:
  verdict: 能继续，但重复检查较多
  category: [已做步骤的利用]
  judgment: 系统记住“已安装且干净”，并非完全丢失事实；仍要求重做安装检查。后续检查磁铁是新增检查，不能和重复步骤混为一谈。
  next: 先确认已完成的具体检查，能跳过的直接跳过，再检查磁铁。
T17:
  verdict: 已验证排障流程推进
  category: [知识已执行]
  judgment: 微动开关、放置到位、插头及夹线注意事项符合当前资料，未混成机器人水箱问题。
  next: 两次模拟未解决后需要真实订单材料。
T18:
  verdict: 方向可接受，承接和语言可改
  category: [已做步骤的利用, 回复语言]
  judgment: 新机也可能有运输残留或安装不到位，检查滚筒不算错误。但应先承接开箱即报错、保护贴已去除，避免像没看原文。荷兰语客户收到英语卡片。
  next: 明确检查新增内容并保持原语言；无效后售后。
T19:
  verdict: 停在合理的事实追问
  category: [知识已执行, 信息不足]
  judgment: 要求检查密封圈后区分正常、损坏、未检查，不能替客户选择硬件已坏。测试停在此处是为了不伪造现场事实。
  next: 客户选择真实结果或补照片后继续。
T20:
  verdict: 知识检索完成，但尚无适用方案
  category: [知识适用性, 回复语言]
  judgment: 两次对照均保留无法定位和任务结束返回基站，没有说清扫已经完成。检索有结果，但主要是返航、起点及受困条目；部分候选证据引用无效，另一些因不支持当前现象被拒。不能简单写成没查库，也不能认定随便选一条就能解决。
  next: 补问定位失败的提示或错误码；核查引用关联及多语言检索，补充精确的定位失败流程。
T21:
  verdict: 追问方向合理，语言可改
  category: [信息不足, 回复语言]
  judgment: 传感器堵塞可能对应不同错误，询问代码有区分价值。没有继续要求已多次做过的清洁重启。法语客户收到英语问题。
  next: 得到具体代码后选择流程，保持法语。
T22:
  verdict: 已验证排障流程推进
  category: [知识已执行, 回复语言]
  judgment: 边缘悬空与平地误报使用条件句区分，未把客户直接断言为卡在楼梯。两步无效后售后。荷兰语答复应改。
  next: 客户核实场景及订单；不根据模拟未解决诊断硬件损坏。
T23:
  verdict: 已验证排障流程推进
  category: [知识已执行]
  judgment: 对E41提供更新及重启，再进入售后，未承诺电池能靠软件修好。
  next: 真实复测及保修核对。
T24:
  verdict: 已验证排障流程推进
  category: [知识已执行]
  judgment: 对清水泵异常给基站断电10秒再试，未误诊为水量不足；失败后进入售后。
  next: 实机反馈及订单核对。
T25:
  verdict: 已验证排障流程推进
  category: [知识已执行]
  judgment: 清洁对应传感器并重启，再售后，故障部位保持一致。
  next: 实机反馈及订单核对。
T26:
  verdict: 步骤有依据，操作描述需官方澄清
  category: [官方口径, 操作前提]
  judgment: “垂直翻转360度并摇晃”来自rv-0063，不是Agent自创。但方向、幅度、准备条件含糊；第三方清洁剂使用史属于真实事实，测试没有替客户回答。
  next: 官方明确操作示意及限制；收集是否添加清洁剂后再进入条件分支。
T27:
  verdict: 已承接原文，但仍重复首步
  category: [已做步骤的利用]
  judgment: 明确保留无堵塞、已清洁、反复咔裂声和不能启动。安装时一次到位声与运行中反复异响不同，卡片没有直接把异响说成正常，但继续清理缠绕的收益有限。
  next: 跳过确认已完成的检查，针对反复异响和无法启动继续诊断或售后。
T28:
  verdict: 已验证排障流程推进
  category: [知识已执行, 回复语言]
  judgment: 2111重启无效后售后，没有冒用相近滚刷错误的长流程。德语客户收到英语卡片。
  next: 保持德语并收集售后材料。
T29:
  verdict: 部分新增检查合理，过保去向仍需说明
  category: [知识已执行, 官方口径, 已做步骤的利用]
  judgment: 盖锁扣和压盖测试提供了新信息，不等于只让客户重做清洁；清洁水盘有重复。过保后不应让客户误以为所有维修渠道都不存在。
  next: 官方明确付费维修或配件支持，系统承接已做步骤。
T30:
  verdict: 对照组保留刚更换边刷的事实
  category: [知识已执行, 图片识别合理]
  judgment: 照片红环与机器人定位合理；刚换边刷并不能排除缠绕或安装问题。对照组明确承接两天前更换，默认组没有承接。
  next: 两步失败后售后核实，不直接建议再买一副边刷。
T31:
  verdict: 首次明确选错方案，复测变正确
  category: [系统选方案, 知识找到却未正确采用]
  judgment: 客户已在基站却不能充电，首次要求清除返航路径障碍，是场景错配。rv-0473与rv-0363确实已检索到，但因证据引用被拒；回收候选后选成E7K。复测能选rv-0473并走四步，证明该问题不稳定，不能用复测覆盖首轮失败。
  next: 修证据编号关联和方案适用检查；用“在基站不充电／回不到基站”成对回归。
T32:
  verdict: 临时方案有官方依据
  category: [知识已执行, 官方口径]
  judgment: 胶带固定传感器来自现有资料，并明确为临时方法，不是Agent随意教用户改机。是否长期适用及之后维修方式仍应由官方说明。
  next: 确认临时操作边界；无效后售后。
T33:
  verdict: 已验证排障流程推进
  category: [知识已执行]
  judgment: 陀螺仪错误重启无效后售后，没有假称传感器已经修复。
  next: 实机结果及售后材料。
T34:
  verdict: 承认不知道合理，但没有交代下一步
  category: [知识覆盖待核, 服务流程]
  judgment: 维修后地图丢失与普通建图失败不同，不能凭相近资料承诺恢复。当前回答只说证据不足，未形成可执行的维修追踪或人工接续。
  next: 收集维修案件号及地图截图，转对应售后核实维修是否清除了地图；补官方可恢复性口径。
T35:
  verdict: 当前解释合理
  category: [正常功能说明]
  judgment: 原文是正常低电量回充续扫提示，不需要硬套故障排查。解释充电后继续剩余清扫符合该提示。
  next: 只有实际未继续清扫时再收集异常情况。
T36:
  verdict: 停在有价值的事实追问
  category: [信息不足, 回复语言]
  judgment: 区分去掉滚刷后仍响与不响能帮助定位；没有重复要求更换已换的滤网。需确认官方允许的测试方式，不能替客户判断是电机坏了。
  next: 客户提供噪声类型或录音，并保持荷兰语回复。
T37:
  verdict: 记住已做检查，但步骤仍冗余
  category: [已做步骤的利用, 回复语言]
  judgment: 已满、软管及胶件正常都被承接，但又展示“若空则加水”，对当前情况帮助小。允许直接反馈未解决缓解了问题，却没真正利用已知条件裁剪步骤。
  next: 跳过补水，明确只需确认新增的重启或层高条件；保持荷兰语。
T38:
  verdict: 附件类型正确，停在必要检查
  category: [图片识别合理, 信息不足]
  judgment: 把发票当发票，没有看图编造水箱故障。反复洗拖布不等于密封圈已检查，要求后者合理。
  next: 根据密封圈真实结果走分支；不把发票当作故障照片。
T39:
  verdict: 当前追问可接受
  category: [知识已采用, 信息不足]
  judgment: 询问是否固件升级后离线是核实条件，尚未断言升级导致故障。与西语T43相比，检索及进入流程的表现不一致。
  next: 客户回答升级时间；系统应让同义多语言诉求获得同等处理。
T40:
  verdict: 产品消歧及后续流程合理
  category: [信息不足, 知识已执行]
  judgment: S1 Pro存在跨品类同名，正文未给PN，确认产品可接受。选择扫地机后进入清洁剂瓶安装与官方文章检查，没有误入吸奶器。
  next: 客户确认是否按文章执行；不能拿工单表外部标签冒充客户已提供的信息。
T41:
  verdict: 摘要否定词丢失，必须修
  category: [意图与事实, 多请求处理, 知识适用性]
  judgment: 原文说没有运行拖地、没有需要烘干，转人工摘要的已做操作却写成“run mop cycles；needed any mop drying”。配送诉求仍在待办队列及交接原文中，没有完全丢失；但对外只说转人工，未交代配件进度如何继续。烘干相关资料被检索到，部分引用又被拒。
  next: 修否定事实提取及交接摘要；明确人工同时核查注水、误报烘干与配件物流，避免让用户重述。
T42:
  verdict: 售后方向可接受，图片关系识别错误
  category: [图片识别, Agent能力边界]
  judgment: 实图是手拿脱落塑料件，背景才是机器人底面；模型将它们合并为手持机器人底部，把接触片也归到前景。文字已足够支持损坏售后，但不能因此判图片识别通过，更不能凭图确定具体损坏零件名。
  next: 分开前景零件与背景机器，要求不确定时保留不确定性；售后核实漏水及部件。
T43:
  verdict: 多语言检索及追问质量需改
  category: [知识检索偏差, 回复语言]
  judgment: 西语“机器人离线”被正确提取成症状，不能笼统说完全没理解。证据却以悬空、受困、返航为主，没有得到T39的离线入口；首轮泛问，复测改问App离线还是通信码。澄清本身可接受，但同义输入效果不一致且使用英语。
  next: 对齐多语言搜索词和离线类候选，使用西语做有区分价值的追问。
T44:
  verdict: 首轮合理，补测发现无法切换请求
  category: [Agent权限边界, 多请求处理]
  judgment: 首轮用户要更换，核对保修有依据。补测明确说暂时没有订单、先处理触针，系统仍排序为更换优先并再次索要订单，未响应新要求。若损坏触针不能安全自行排查，应解释限制并提供接续，不应循环追材料。
  next: 允许客户调整优先级；物理损坏只能售后时明确原因，不教用户强行掰触针。
T45:
  verdict: 安全分流合理
  category: [Agent能力边界, 安全处理]
  judgment: 已有烫伤和变色，先停用、停止充电再人工处理，比继续充电测试合理。附件为购买截图，本轮没有执行故障视觉识别，不能计入图片识别成功率。
  next: 专业售后处理安全事件及购买凭证，不让自动排障延迟接续。
T46:
  verdict: 停在有价值的事实追问
  category: [图片识别合理, 信息不足]
  judgment: 订单截图类型识别正确；持续或间歇噪声是必要区分，不因为使用不到一个月就直接承诺更换。
  next: 补噪声类型、发生时机和录音，再排障或售后。
T47:
  verdict: 查询对象区分正确
  category: [Agent数据边界]
  judgment: 旧整单商品T8D04121与待查替换主机T8D02181-80不同。系统明确没有后者独立发货记录，没有拿旧运单冒充配件运单。
  next: 客户提供售后案件号或独立订单，或业务方关联两者。
T48:
  verdict: 首轮追问合理，补充事实后回答正确
  category: [图片识别, 信息不足, 官方口径]
  judgment: 看得到绿灯、黄灯列和外壳裂纹，但静态照片无法证明灯常亮或闪烁。补测人为补充S1 Pro型号和绿灯常亮后，系统正确回答充电完成，也提示裂纹待核实，与官网灯表一致。这是附加事实的条件分支，不能反推原照片证明常亮。
  next: 原客户仍需确认型号和灯态；不要混成加热灯，也不要根据静态照片推断闪烁。
T49:
  verdict: 更换优先符合请求
  category: [Agent权限边界, 官方口径]
  judgment: 用户明确要更换，先问购买凭证合理；自付加保险不自动等于可由厂商直接退换，系统没有作出该承诺。
  next: 官方明确保险与经销渠道处理规则，材料齐后判断；必要时继续排障。
T50:
  verdict: 关键否定关系未误读
  category: [意图与事实, 信息不足]
  judgment: 左泵确实能工作，系统没有补出not，也没有擅自指定右泵坏了。问哪一侧、什么现象正是必要澄清。
  next: 客户补全实际故障后再检索。
T51:
  verdict: 能继续排障，未解决后的服务出口不足
  category: [知识已执行, 官方口径, 服务流程]
  judgment: 对照组在过保后仍走使用中关机流程，比默认组直接结束更完整。最后明确未解决而结案，没提供新的服务申请；不能等同客户不再需要帮助。“speaker cover”和蓝牙步骤来自bp-0111，需官方确认术语及相关性。
  next: 官方给出过保维修出口和资料修订；系统在排障无效后提供相应接续，不能只结束。
T52:
  verdict: 故障对象守住，知识缺口仍在
  category: [Agent能力边界, 知识覆盖待补]
  judgment: 本轮对照明确“充电盒自己充不进电”，没有套成泵不开机或盒给泵不充电。诊断模型被跳过是该对象保护逻辑，不是这案模型调用失败。公开官方相关文章主要讲盒给泵充电，不能仅看标题便认为覆盖盒自身输入问题。
  next: 官方补充充电盒输入端排障与售后条件，再开放相应自动流程。
T53:
  verdict: 更换或维修诉求被截断，必须修
  category: [多请求处理, 服务流程, 官方口径]
  judgment: 首轮按过保拒绝后停止；复测虽然说继续排障，紧接着却说未解决已结案，没有任何操作卡。用户还有维修请求及保内发生但延迟报修的陈述，两者不能用当前过保一笔抹去。
  next: 系统保留维修分支并提供人工接续；官方判定延迟申报政策。发票日期与自述24个月不完全一致，应核对而非自行判客户虚假。
T54:
  verdict: 已走完七步排障，仍待售后
  category: [知识已执行, 官方术语]
  judgment: 无吸力流程涵盖密封、佩戴、设置与主机吸力检查；七次未解决是测试反馈，不是实机结论。末步的“软管”来自原资料，需确认是否适用于此穿戴型号，不能擅改成另一部件。
  next: 真实反馈及售后材料；知识负责人校正型号术语。
T55:
  verdict: 找到了直接相关知识，却没执行
  category: [系统证据关联, 知识找到却未采用]
  judgment: 两次均转人工。首轮证据含bp-0102“咔哒响但没吸力”，也有无吸力条目；生成方案却引用了不在本轮证据中的编号，被校验丢弃。最终称官方资料不覆盖，归因不准确。右泵正常和左泵异常关系没有倒置。
  next: 修模型输出与本轮证据编号绑定，失败后重新关联或诚实说明无法确认；保留已有隔膜检查，继续尚未做的适用步骤。
T56:
  verdict: 抓住保修反问，却漏了离线故障
