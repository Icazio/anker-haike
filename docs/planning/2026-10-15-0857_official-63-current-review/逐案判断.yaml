  judgment: 两次都只保留warranty_query并索要订单号。客户已经给出S340离线和仅用一周，主要问题不应因为一句反问就消失。
  next: 同时建立离线排障和保修查询；先承接离线现象，按所需信息推进。
T57:
  verdict: 首轮操作前提不足，复测路径不稳定
  category: [系统适用性, 官方口径]
  judgment: 正文只说多台摄像头失效，首轮直接确认为S340并要求重置、连接HomeBase，没有确认型号、连接方式及多设备共同故障。步骤来自bp-0166，问题是过早套用。复测改成询问App版本，表明方案选择不稳定。
  next: 先确认设备与连接拓扑、是否全部同时失效，再选单机或共同链路检查；重置前说明影响。
T58:
