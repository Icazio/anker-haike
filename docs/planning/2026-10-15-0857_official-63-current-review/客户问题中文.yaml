T1: [主机没收到，只收到配件, '吸尘机器人没有送到，只收到替换配件包。主机发货了吗？我该怎么办？订单Anker001。']
T2: [包裹内容与物流记录对不上, '订单Anker002。今天收到运单Anker1234567-2，里面只有替换配件，没有S1机器人。UPS上的Anker1234567-3只显示已创建面单，没有后续信息。主机什么时候到？']
T3: [询问何时发货, '购买的商品是可接受成色的X10 Pro Omni，订单Anker003。请告诉我什么时候寄出。']
T4: [承诺的配送时间已过, '9月14日下单时标注1—3个工作日送达，订单Anker004。现在包裹在澳洲邮政，对方说9月30日前不跟进查询。我下单前特意确认过配送时间，请帮忙查一下。']
T5: [查询配送进度, '请更新订单Anker005的配送进度。']
T6: [上周买的机器人仍未到, '转发“订单Anker006已发货”的通知。我上周买了扫地机器人，至今还没收到。原文为荷兰语。']
T7: [运单号查不到包裹, '输入运单号查询订单时查不到。你们知道我的订单什么时候能收到吗？未提供订单号。']
T8: [C10未收到, '订单Anker007的吸尘机器人还没收到，请告诉我什么时候到。']
T9: [查发货，并要求没发就先别发, '7日购买的吸尘机器人，订单Anker008，目前只收到滤网。如果主机还没寄出，请先别寄，我想先聊聊其他产品。一直没有收到延迟通知，我也不理解。']
T10: [再次询问C10到货时间, '订单Anker009中的C10仍未收到，什么时候能到？']
T11: [S1 Pro加清水异常EB1L, 'S1 Pro，T2080A。设备提示EB1L：机器人添加清水时发生错误，任务结束，点击联系客服。这里的“联系客服”是设备推送原文。']
T12: [缺水后切到仅吸尘, 'Omni E25，T2353。提示清水不足，已切换成仅吸尘模式以完成任务。']
T13: [机器人与基站通信异常5116, 'Omni E25，T2353，错误5116。机器人与基站通信发生异常，提示联系客服。原文为荷兰语。']
T14: [沿墙传感器异常4090，有现场图, 'Omni E28，T2352，错误4090。沿墙传感器不工作，请检查。正文含两条外链，本地实际附有一张机器人停在基站前、亮红灯的照片。']
T15: [基站集尘风道堵塞EB03, 'S1 Pro，T2080A。设备报EB03：基站集尘风道堵塞，任务结束。']
T16: [尘盒明明装好却报未安装, 'X10 Pro Omni，T2351，错误2310。设备说尘盒或滤网没有装好，但客户明确说已经完全安装好，而且是干净的。']
T17: [便携深度清洁机位置不对6063, 'Omni E28，T2352，提示6063：便携深度清洁机放置位置不正确。']
T18: [新机开箱就报拖布堵塞3212, 'Omni E28，T2352，提示3212拖布卡住。刚开箱，保护贴已经全部去掉，仍然报拖布堵塞。该怎么办？原文为荷兰语。']
