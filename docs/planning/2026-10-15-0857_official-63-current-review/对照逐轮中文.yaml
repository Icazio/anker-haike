  - '操作2：确认正确组装，鸭嘴阀、喇叭罩通道、隔膜和泵主机四个关键部位密封良好。完成后反馈是否解决。'
  - '操作3：调整佩戴位置，乳头在喇叭罩通道中央，不折叠或受压；泵应贴合密封，并能感觉到明显吸力。完成后反馈是否解决。'
  - '操作4：尝试不同尺寸的喇叭罩或内衬，找到适合自身、舒适且吸力合适的尺寸。完成后反馈是否解决。'
  - '操作5：把吸力调至仍感舒适的最高档位。完成后反馈是否解决。'
  - '操作6：同时按住电源键和“+”键约5秒恢复出厂设置，再试用；若仍异常，继续下一步。'
  - '操作7：取下主机头，将吸气口对准手掌，启动后测试吸力。若手掌有明显吸力，主机正常，可能是其他部件问题，原文举例“软管或吸奶器罩”；无吸力则需继续排查。完成后反馈是否解决。'
