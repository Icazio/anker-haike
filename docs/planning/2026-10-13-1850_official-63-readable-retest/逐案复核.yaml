T1:
  title: 只收到配件，没有收到吸尘器
  request: 我的吸尘器没到，只收到替换配件包。主机发货了吗？我该怎么办？订单号是 Anker001。
  judgment: 先报告两个包裹的记录，再提出承运商调查，符合当前资料下的权限边界。两个包裹都用了同一SKU，不能据此独立证明客户已收到主机；应保留客户未收货陈述。当前只提出调查方案，尚未提交调查。
  tags: [Agent边界, 官方记录需核对]
  turns:
    - 订单Anker001：Fedex运单Anker1234567于2026-09-21送达；Amazon Logistic运单Anker1234567-1于2026-09-23送达，两项均显示E235311B。系统称按售后政策，记录已送达时不能直接补发；如实际未收到，可提交承运商调查，由同事核查。展示“提交承运商调查申请”方案，等待确认。
T2:
  title: 收到的包裹与订单记录对不上
  request: Anker002今天收到运单Anker1234567-2，但里面只有配件，S1机器人没到。UPS上另一运单Anker1234567-3只有标签创建信息。主机什么时候到？
  judgment: 回答明确指出“-2记录为主机、客户却说是配件”，同时保留两种说法，没有替官方数据消除冲突。需要人工核对箱标和实际物品；不能把此案当作已解决或丢件确认。
  tags: [Agent边界, 官方记录需核对]
  turns:
    - 订单Anker002：ANPOST的Anker1234567-2在2026-09-21送达，记录SKU为T2080GA1；UPS的Anker1234567-3在2026-09-24送达，记录SKU为T29C2001。系统说明“-2”记录的是主机，与客户称收到配件不符；两边陈述均已保留，请确认各包裹装了什么，可提供箱标供同事与承运商核查。
T3:
  title: 询问购买的X10什么时候寄出
  request: 我买的是描述为可接受成色的eufy X10 Pro Omni扫拖机器人。请问什么时候寄出？订单Anker003。
  judgment: 订单资料已经显示送达，回答正确展示了这一变化。后续调查须客户确认；“何时寄出”无需直接理解为要求补发，因此补发拒绝话术可以简化。
  tags: [Agent边界, 表达可优化]
  turns:
    - 订单Anker003：Royal Mail运单Anker1234567-4于2026-09-25送达，SKU为T2351V11-F。系统说明按当前售后政策，已送达记录不能直接补发；若实际未收到，可提交承运商调查，并展示等待确认的调查方案。
T4:
  title: 承诺1至3个工作日却迟迟没到
  request: 我9月14日下单，当时写1至3个工作日送达。澳大利亚邮政说9月30日前不会追查，我本想避免长时间没有吸尘器，订单Anker004，请帮忙查。
  judgment: 承接不满并给出订单记录和调查入口，没有虚构承运商已处理。原客户时间与静态订单的送达状态不同，报告只能确认资料内结果，不能验证实时物流。
  tags: [Agent边界, 官方记录需核对]
  turns:
    - 系统先为体验致歉。订单Anker004：Australia Post的Anker1234567-5于2026-09-20送达，包含T2353T11、T29YQA20。系统称按政策不能直接补发，若实际没收到可提交承运商调查，展示待确认方案。
T5:
  title: 查询Anker005配送进度
  request: 请更新订单Anker005的配送情况，谢谢。
  judgment: 区分在途主件与已送达配件，并按2026-10-13评测日期发现预计9月30日已过。提出补发申请不等于已经补发；真实承运与订单接口不在此系统权限内。
  tags: [Agent边界]
  turns:
    - 订单Anker005：FedEx运单Anker1234567-6仍在途中，预计2026-09-30送达，SKU为T2353112；USPS运单Anker1234567-7已于2026-09-15送达，SKU为T291HA11。系统称在途包裹超过预计日期，可以申请补发，提交后由同事安排；展示“提交补发申请”方案。
T6:
  title: 荷兰语客户说上周订的机器人仍未到
  request: 转发“订单Anker006已经发货”。我上周订的扫地机器人还没到。
  judgment: 业务路径可接受，显示已送达记录并等待调查确认。但客户用荷兰语，系统全文英语，是实际语言缺陷。
  tags: [Agent边界, 语言问题]
  turns:
    - 系统先致歉。订单Anker006：DHL NL运单Anker1234567-8于2026-09-20送达，含T2353G11、T290QAR0。系统称按政策不能直接补发；若实际没收到，可提交承运商调查。展示待确认的调查方案。
T7:
  title: 查不到物流，但没给订单号
  request: 输入运单号查订单不起作用，我什么时候能收到？
  judgment: 原文没有实际号码，追问订单号或运单号是必要信息收集，不是检索失败。
  tags: [Agent边界]
  turns:
    - 请提供订单号或运单号，我来查询。
T8:
  title: 包裹被退回寄件人
  request: 订单Anker007的吸尘器我没收到，请告诉我什么时候能到。
  judgment: 识别退回寄件人并提出补发申请，符合当前配置流程。没有宣称补发已执行，等待客户确认合理。
  tags: [Agent边界]
  turns:
    - 订单Anker007：USPS运单Anker1234567-9已退回寄件人，SKU为T2292111、T290Y000。系统称可以申请补发，提交后由同事安排。展示“提交补发申请”方案。
T9:
  title: 询问发货，并要求没发就先别发
  request: 我7号买的吸尘器订单Anker008只收到滤网。如果还没发货，先不要发，我想讨论其他产品；延迟却没人通知让我不满。
  judgment: 正确把暂停或改订单置于物流查询之前，并说明自己没有拦截权限。也回答了主机预售日期，没有因为转人工漏掉配送诉求。内部移交不等于仓库已停发。
  tags: [Agent边界]
  turns:
    - 系统致歉，说明按“修改订单→配送状态”处理。它不能自行修改或暂停订单，已交同事，订单可能仍在处理。随后报告：T2292111主机预售、尚未发货，原预计2026-10-20发出；US YANWEN运单Anker1234567-10的T290Y000于2026-09-12送达。是否暂停或取消，由处理请求的同事决定。
T10:
  title: C10没收到，记录却已送达
  request: Anker009的C10扫地机器人还没到，什么时候收到？
  judgment: 回答分列两个包裹的状态并提出调查。静态资料中的另一个SKU与客户本次主诉不同，应由人工核对，不能仅凭全单已送达否定客户。
  tags: [Agent边界, 官方记录需核对]
  turns:
    - 订单Anker009：USPS运单Anker1234567-11的T2292111于2026-09-25送达；Amazon Logistics运单Anker1234567-12的T2351111于2026-08-27送达。系统称已送达时不能直接补发，若实际未收到，可提交承运商调查，并给出待确认方案。
T11:
  title: S1 Pro加清水报EB1L
  request: S1 Pro，型号T2080A，报错EB1L：机器人添加清水出错，任务结束，提示联系客服。
  judgment: 采用对应错误码的rv-0481，逐步检查水路并在统一未解决反馈后收售后材料。执行链完整；本测试未实际检查水管或更新固件，不能证明硬件故障或真实修复率。
  tags: [知识已执行, Agent边界]
  turns:
    - 从基站取出清水箱，检查出水孔密封圈是否安装正确；用手电照水箱管路，看内部管子是否损坏。卡片附密封圈和水管示意图。
    - 加清水至最高水位线，并确保水箱牢固放入基站。
    - 检查机器人进水口是否有杂物或堵塞，用纸巾或棉签清理；附进水口示意图。
    - 报错后把机器人移离基站，检查基站注水口橡胶塞处有无水，并看胶塞是否损坏或缺失；附图。
    - 将固件更新到7.0.143或更高版本。
    - '@warranty'
T12:
  title: E25缺清水后变成只吸尘
  request: Omni E25，型号T2353：清水不足，机器切换成只吸尘以完成任务。
  judgment: 选用rv-0021补水、重新发起拖地的步骤，方向正确。可再解释这是缺水保护行为，不能把系统提示本身当成已经确认硬件损坏。当前未作硬件断言。
  tags: [知识已执行, 表达可优化]
  turns:
    - 检查基站清水箱；若空了就加水并重新开始清洁。如果机器人在与基站同一楼层启动，加水并新建拖地任务后仍出现问题，联系支持。卡片回显“清水不足转只吸尘”的描述，说明如已经按相同步骤检查且仍异常，可选未解决。
    - '@warranty'
T13:
  title: E25的5116通信错误没有对应条目
  request: 荷兰语：Omni E25报5116通信异常，机器人与基站之间通信出错，提示联系客服。
  judgment: 内部状态为code_miss，即当前知识没有对应错误码；不借相似代码强行维修而转人工合理。需要官方补知识；英语回复荷兰语客户另算语言问题。
  tags: [官方知识缺口, Agent边界, 语言问题]
  turns:
    - 未能确认针对这个问题的官方排障指引，已把问题和支持资料提交同事审核；等待期间可继续补充信息。
T14:
  title: E28墙面传感器报4090
  request: Omni E28，型号T2352，4090传感器异常，提示墙面传感器不工作，请检查；附机器人与基站照片。
  judgment: 系统按错误码官方条目进入硬件售后，而不是从照片红灯猜故障。照片只能确认机器人、基站和红灯可见，不能独立证明传感器损坏；售后诊断仍需审核。
  tags: [知识已执行, Agent边界]
  turns:
    - 根据这个错误码的官方指引，系统将其按硬件故障处理，下一步是售后审核，不继续排障；是否保修取决于后续核查。请提供订单号；其他卖家购买的请上传包含卖家、购买国家和日期的凭证。
T15:
  title: S1 Pro基站集尘通道堵塞
  request: S1 Pro报EB03：基站集尘通道堵塞，任务结束。
  judgment: rv-0428的四步内容与故障匹配。最后一步要求翻转基站、拆透明盖，卡片没有专门安全提示；应让官方确认这一步的断电、排空和用户可操作范围，不能把它说成模型编造拆机。
  tags: [知识已执行, 官方说明待完善]
  turns:
    - 取下清水箱，打开尘袋盖，确认尘袋已正确安装；取出尘袋看集尘口是否堵塞，有堵塞就手动清理。附尘袋及集尘口图。
    - 取下机器人的磁吸盖和尘盒，查看尘盒是否满、入口是否被异物堵住；如有则清理。附尘盒与滤网图。
    - 检查基站集尘入口有无异物，发现后清理。附图。
    - 取下基站清水箱和污水箱，翻转基站，拧下透明盖上的两颗螺丝，移开白色胶塞，查看集尘通道是否堵塞。附底部通道图。
    - '@warranty'
T16:
  title: 尘盒和滤网已装好，却仍报未安装
  request: X10 Pro Omni报2310，要求安装尘盒和滤网，但我确认已经装好且干净。
  judgment: rv-0056进一步检查滤网磁铁有用，但首卡重复问是否装滤网，未承接客户已装好事实。列为体验改进，不能因一个重复检查把整条排障判无效。
  tags: [知识已执行, 重复询问可优化]
  turns:
    - 取出集尘盒、打开盖子，检查是否装有滤网；没装则装好再试。附安装图。
    - 如果滤网已正确安装，进一步查看图示位置有没有磁铁。附磁铁位置图。
    - '@warranty'
T17:
  title: E28便携清洁机位置异常
  request: Omni E28报6063，提示便携深度清洁机摆放不正确。
  judgment: 对应rv-0498，先检查微动开关和放置，再查供电，步骤与对象一致。卡片保留收好软管、防夹电源线和避免顶墙提示。
  tags: [知识已执行, Agent边界]
  turns:
    - 提起便携深度清洁机，按基站微动开关，看是否能正常压下、回弹；放回设备，用手按污水箱保证到位。注意收好软管，避免夹电源线或放置时碰墙；附取放视频。卡片回显原故障描述。
    - 检查基站电源插头是否插牢，供电松动可能被误判为清洁机放置不到位。卡片仍提醒收好软管、防夹电源线、避免碰墙，并附电源图。
    - '@warranty'
T18:
  title: 新E28已撕保护贴，仍报拖布堵塞
  request: 荷兰语：新开箱的Omni E28已去掉所有保护贴，仍报3212滚筒拖布堵塞，怎么处理？
  judgment: 去保护贴不等于已检查滚筒缠绕及安装，发rv-0147合理。英语卡片和结尾不符合客户语言。
  tags: [知识已执行, 语言问题]
  turns:
    - 取出污水盒，检查滚筒是否缠着绳线、数据线、塑料袋、头发等，清理后确保能转动。安装时听到咔嗒声说明已装到位，参考安装视频。开始清洁前先整理电线，防止再次卡住。
    - '@warranty'
T19:
  title: X10清水不足，需要客户确认检查结果
  request: X10 Pro Omni报6011，基站清水箱水不足，提示加水后放回。
  judgment: 查密封圈后问“完好但仍报错/已坏/未查”，没有把未解决反馈自动当成密封圈完好，分支边界正确。原文没有这一事实，测试到问题卡停止。
  tags: [知识已执行, 等待事实合理]
  turns:
    - 检查清水箱部件；有水先倒出，查看出水口密封圈是否装好、有无损伤，变形或破损则提供照片。卡片说明照片另行上传，不影响先回答该卡；并回显缺水描述。
    - 请选检查结果：①密封圈和水箱部件看起来正常，重装后仍报错；②密封圈变形或损坏；③还没检查。说明只有相关部件、基站密封圈和安装均正常而仍报错时，才按资料判断基站硬件问题。
T20:
  title: 定位失败的排障建议被直接标成结束
  request: 荷兰语：X10 Pro Omni无法确定位置，任务结束并回基站；附基站摆放照片。
  judgment: rv-0090正文给了重建地图和再次运行的实际动作，但系统只发一段话即标done，没有动作反馈入口。内容方向匹配，不能称答非所问；问题在排障未形成后续确认。两次新会话一致。另有英语回复问题。
  status: 系统需改
  tags: [系统本身要改, 知识执行方式不完整, 语言问题]
  turns:
    - 出现这个提示，可能是家庭环境或基站附近环境变化较大，与已有地图差异造成定位失败。请重新建图并开始新任务，确认提示是否消失。
T21:
  title: 激光传感器反复报堵，清洁重启无效
  request: 法语：两周以来吸尘器一直提示激光传感器堵塞。我们多次清洁并重新启动，同样错误仍回来。
  judgment: 回显已清洁重启的事实，追加具体的保护膜与雷达孔检查，避免了简单反复重启。重复部分可优化，当前核心流程合理；语言仍错误。
  tags: [知识已执行, 语言问题]
  turns:
    - 如果顶面保护膜翘起妨碍雷达，请确认已去掉保护膜。卡片回显反复激光堵塞及已清洁重启，说明若已经逐项按要求检查且仍异常，可以选未解决。附保护膜图。
    - 清除挡住雷达的异物，附图。
    - 用棉签等柔软材料擦拭雷达发射、接收孔，附图。
    - '@warranty'
T22:
  title: X10轮子未着地
  request: 荷兰语：X10 Pro Omni报7002，机器人悬空，轮子没有接触地面，提示换个位置。表单还给了固件v3.4.85、荷兰账号/系统地区、安卓设备信息。
  judgment: 匹配rv-0106；台阶卡住与平地仍报错两个条件写得清楚，未把荷兰账号国家当购买国家。英语输出单独记问题。
  tags: [知识已执行, 语言问题]
  turns:
    - 如果经常卡在楼梯边缘或家具上触发提示，建议在App里设禁入区。
    - 如果在平地仍报错，尝试重启机器人，看是否恢复。
    - '@warranty'
T23:
  title: S1 Pro电池异常E41
  request: S1 Pro报E41电池异常、任务结束，建议重启或联系客服。
  judgment: 对应rv-0138，给固件更新和重启，再收售后材料。当前没有电池损伤、冒烟等具体风险描述，不能凭错误名称直接认定安全事故。
  tags: [知识已执行, Agent边界]
  turns:
    - 在App内把机器人固件更新到最新版本。
    - 重启机器人，看能否正常工作。
    - '@warranty'
T24:
  title: X10基站清水泵报6013
  request: X10 Pro Omni报6013注水装置异常，描述为基站清水泵错误。
  judgment: 对应rv-0273，断电等待10秒再通电，随后确认和售后流转。等待时长完整保留，没有不匹配的其他型号操作。
  tags: [知识已执行, Agent边界]
  turns:
    - 拔掉基站电源线，等10秒后重新插上，再启动清洁任务，观察是否继续报错。
    - '@warranty'
T25:
  title: S1 Pro的TrueAI传感器报E53
  request: S1 Pro报E53 TrueAI传感器异常、任务结束，建议重启或联系客服。
  judgment: 对应rv-0451，清洁指定传感器、再重启，方向准确。测试只验证收到未解决后收材料，不判断传感器实际损坏。
  tags: [知识已执行, Agent边界]
  turns:
    - 检查3D MATRIX EYE传感器是否有污物，用干净软布擦净，附位置图。
