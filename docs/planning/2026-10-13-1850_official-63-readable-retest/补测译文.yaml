T20:
  judgment: 同一旧运行版本重复后仍只解释重建地图，直接结束，未出反馈卡。内容相关，流程闭环缺失稳定出现。
  turns:
    - 若出现这个提示，可能因家庭环境或基站附近环境变化，与既有地图差异较大而定位失败。请重建地图并开始新任务，确认提示是否解决。
T31:
  judgment: 同版本第二次模型成功，使用rv-0363完成充电检查。证明有可用知识，但这次未触发超时，不能以此证明异常分支已修好。虽然再次擦触点，首卡承接了客户已擦事实；恢复出厂前显示删地图提醒。
  turns:
    - 检查基站是否通电、屏幕及水箱内指示灯是否正常亮起；回显在基站充不进电、电量极低、已擦触点，说明已按要求查过仍异常可选未解决。
    - 若基站未通电，试其他插座，并检查背面电源线是否插牢；松动可能导致无电，附电源线图。
    - 擦拭机器人和基站充电针脚，确保没有污物，附两处触点图。
    - 长按Wi-Fi指示灯旁的红色按钮恢复出厂，等5分钟，确保机器在基站且触点接触。提醒长按红键超过5秒会删除地图，之后要重新绘制房屋地图；附正确触点接触图。
    - '@warranty'
T40:
  judgment: 这次正确采用rv-0073清洁液条目，先查安装，再问是否完成外链步骤，停在客户事实问题。这不能覆盖主轮选错清水条目的事实，说明同版本仍有波动。
  turns:
    - 展示产品选择卡，请确认具体型号。
    - 确保清洁液瓶正确安装，回显液位几乎不变；按要求检查后仍异常可选未解决。
    - 是否已经尝试卡片链接中的官方建议？选项“试过仍不投放”“还没试”。附清洁液使用与检查文章，等待真实回答。
T41:
  judgment: 这次从直接注水动作改为询问注水错误码，属于合理核实之一，但仍未直接回应未拖地为何烘干报警，也没推进替换件查询。故不能视为全部诉求已经答好。
  turns:
    - 说明按“设备排障→配送状态”处理，随后问是否看到具体注水错误码，例如6018或6019。
T42:
  judgment: 可见答复同主轮，进入物理损坏售后。视觉内部状态另行核对，不以售后走对推定读图准确。
  turns:
    - 根据描述的损坏，系统认为下一步是售后审核，是否保修另查；请给订单号，其他卖家购买则上传包含卖家、购买国家和日期的凭证。
T48:
  judgment: 可见回复继续区分可见绿灯、壳体裂纹与未知灯态，没有说裂纹导致绿灯。此次内部视觉也只写灯的数量，没有写常亮，说明主轮问题不是每次出现。官方灯态图尚未成功取得可读内容。
  turns:
    - 请提供产品类别及型号，也可提供铭牌上的型号，再查这个问题。
    - 照片中电源键旁有绿灯、左侧一列三个黄灯亮起；触点附近外壳左边缘有裂纹，需要核实，但不假定与灯态有关。当前提供资料未覆盖该型号绿灯及黄灯的含义，只说明常亮红灯是电量低于20%、闪烁红灯是低于10%。请查手册或App，并说明绿灯是常亮还是闪烁、何时出现，供同事核实。
T50:
  judgment: 两次都询问左右表现差异，没有反转“左边能用”的肯定句，也未执行维修。可以进一步用更开放的问题避免预设左右有故障差异。
  turns:
    - 能描述左右电机在表现上有什么不同吗？
T52:
  judgment: 改用bp-0039后步骤更多，但前两步对准的是盒给泵供电的磁吸连接，第四步复位泵，仍不直接针对盒自身输入不充电。第六步适配器检查相关；需先分供电方向和故障对象，不能按发卡数量判提升。
  turns:
    - 把泵主机充电针脚对准盒内磁吸口，松手后应完全入槽并有咔嗒声、盒灯闪白；不闪则调整针脚位置。
    - 检查盒与泵的磁吸触点是否有胶残留、灰尘、杂物，用干布或棉签清洁。
    - 盒自身充满需3.2小时，盒给泵充满需1.7小时；内部灯常亮后10分钟熄灭表示泵充满。
    - 长按泵电源键12秒复位，再尝试充电。
    - 将另一只泵放进本盒，或将这只泵放入另一个正常盒，区分盒与泵的问题。
    - 尝试至少5V-2A输出的充电器。
    - '@warranty'
T57:
  judgment: 仍为版本问题卡，停在真实版本信息，符合本轮策略。没有跳过版本采集。
  turns:
    - 系统致歉，询问Anker eufy App版本，可在设置中的关于或应用信息中查看并回复。
T61:
  judgment: 从低电未启动换成其他任务占用的追问，仍未承接固定提前两小时及记录缺失。不能因为改了问题就认为已解决意图偏移。
  turns:
    - 系统致歉，询问预定清洁触发时是否还有其他任务进行中，例如清洁、续扫、回充或集尘。
